 const step4=(pick,req)=>{
  msgEditor({title:T+' · Edit',h:bi('Make your improvement.','Lakukan perbaikanmu.'),vals:draft,sit:`<p class="intro">${bi(pick[0],pick[1])}</p>`,back:()=>step3(req),backLabel:['Choose another improvement','Pilih perbaikan lain'],onDone:(v,c)=>{
   if(v.g===draft.g&&v.b===draft.b&&v.c===draft.c){msg('Change something first.','Ubah sesuatu dulu.');return}
   add();imp=1;fmsg={...v};mck=c;finish(i,bi('You checked your message and made it better!','Kamu memeriksa pesanmu dan membuatnya lebih baik!'))}})};
 step1()}

/* Exit Ticket & Reflection */
const WAYS=[['sending a message','mengirim pesan'],['writing an email','menulis email'],['making a video call','melakukan video call'],['sharing information','berbagi informasi'],['creating a digital announcement','membuat pengumuman digital']];
const PARTS=[['a greeting','salam pembuka',1],['a message','isi pesan',1],['a closing','penutup',1],['a picture','gambar',0],['a sound','suara',0]];
function exitTicket(){
 let wy=null,sel=[],tries=0,hinted=0;
 const N='Exit Ticket &amp; Reflection';
 const bl=t=>t?`<span class="blank f">${t}</span>`:'<span class="blank">&nbsp;</span>';
 const s1=()=>bi(`I can use a computer to communicate by ${bl(wy!==null&&WAYS[wy][0])}.`,`Aku bisa memakai komputer untuk berkomunikasi dengan ${bl(wy!==null&&WAYS[wy][1])}.`);
 const s2=(a)=>bi(`A good digital message has ${[0,1,2].map(j=>bl(a&&a[j]!==undefined&&PARTS[a[j]][0])).join(', ')}.`,`Pesan digital yang baik punya ${[0,1,2].map(j=>bl(a&&a[j]!==undefined&&PARTS[a[j]][1])).join(', ')}.`);
 const intro=`<p class="intro">${bi('No stars here. This shows what you learned.','Di sini tidak ada bintang. Ini untuk menunjukkan apa yang kamu pelajari.')}</p>`;
 const step1=()=>{
  A.innerHTML=`${hdr(N+' (1/2)')}${intro}<div class="sent">${s1()}</div><h2>${bi('Choose one way a computer helps us communicate.','Pilih satu cara komputer membantu kita berkomunikasi.')}</h2><div class="opts"></div>`;
  const o=A.querySelector('.opts');
  WAYS.forEach((w,k)=>{const b=$(`<button>${bi(w[0],w[1])}</button>`);b.onclick=()=>{wy=k;b.classList.add('ok');A.querySelector('.sent').innerHTML=s1();ok();setTimeout(step2,1200)};o.append(b)})};
 const step2=()=>{
  sel=[];
  A.innerHTML=`${hdr(N+' (2/2)')}${intro}<div class="sent" id="s">${s2([])}</div><h2>${bi('Tap the three parts of a good digital message.','Ketuk tiga bagian pesan digital yang baik.')}</h2><div class="opts"></div><p id="msg" class="msg"></p><button class="go" id="dn" disabled>${bi('Done','Selesai')}</button>`;
  const o=A.querySelector('.opts'),dn=A.querySelector('#dn'),bs=[];
  const upd=()=>{A.querySelector('#s').innerHTML=s2(sel);bs.forEach((b,k)=>b.classList.toggle('ok',sel.includes(k)));dn.disabled=sel.length!==3};
  PARTS.forEach((p,k)=>{const b=$(`<button>${bi(p[0],p[1])}</button>`);bs.push(b);
   b.onclick=()=>{const j=sel.indexOf(k);if(j>=0)sel.splice(j,1);else if(sel.length<3)sel.push(k);upd()};o.append(b)});
  dn.onclick=()=>{
   const right=sel.every(k=>PARTS[k][2]);
   if(right){ok();step3(sel.slice())}
   else{tries++;snd(180,.2);
    if(tries>=2){hinted=1;sel=[0,1,2];upd();msg('This is the answer. Let us keep going!','Ini jawabannya. Ayo lanjut!',1);setTimeout(()=>step3([0,1,2]),2800)}
    else{msg('Not quite. Think about the parts of a message.','Belum tepat. Pikirkan bagian-bagian pesan.');sel=[];upd()}}}};
 const step3=a=>{
  et={w:WAYS[wy][0],b:a.map(k=>PARTS[k][0]),x:tries,h:hinted,done:1};save();
  A.innerHTML=`<div class="card"><div class="big">📝</div><h2>${bi('My Exit Ticket','Tiket Keluarku')}</h2><div class="sent">${bi(`I can use a computer to communicate by <b>${WAYS[wy][0]}</b>.`,`Aku bisa memakai komputer untuk berkomunikasi dengan <b>${WAYS[wy][1]}</b>.`)}</div><div class="sent">${bi(`A good digital message has <b>${a.map(k=>PARTS[k][0]).join(', ')}</b>.`,`Pesan digital yang baik punya <b>${a.map(k=>PARTS[k][1]).join(', ')}</b>.`)}</div><p>${bi('Ready to share? Read your sentences to the class!','Siap berbagi? Bacakan kalimatmu di depan kelas!')}</p><button class="go" onclick="home()">${bi('Back to menu','Kembali ke menu')}</button></div>`};
 step1()}
start();
</script></body></html>
