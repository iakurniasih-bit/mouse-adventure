<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Computer Adventure 3 – Pertemuan 3</title>
<style>
:root{--bg:#fdf3dc;--ink:#26204a;--card:#fffdf7;--line:#26204a;--blue:#3b82f6;--org:#f97316;--grn:#16a34a;--sun:#ffc93c;--mute:#6b6590;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1738;--ink:#fff4dc;--card:#2a2456;--line:#fff4dc;--mute:#b9b2e0}}
:root[data-theme="dark"]{--bg:#1b1738;--ink:#fff4dc;--card:#2a2456;--line:#fff4dc;--mute:#b9b2e0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Comic Sans MS",system-ui,sans-serif;font-size:18px}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;max-width:900px;margin:0 auto}

#sc{background:var(--sun);color:#26204a;border-radius:99px;padding:6px 16px;font-weight:700;border:3px solid var(--line)}

h1{font-size:clamp(28px,6vw,44px);margin:8px 0}

.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.mb{position:relative;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 5px 0 var(--line);display:grid;gap:2px}
.mb>span{font-size:38px}.mb small{font-size:15px;color:var(--mute)}.mb em{position:absolute;right:12px;top:10px;font-style:normal;font-size:26px}
.mb:hover{transform:translateY(-2px)}.mb:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.top{display:flex;gap:12px;align-items:center;margin-bottom:6px}

.top span{font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}

.pc.ok{background:#bbf7d0;color:#14532d}
.msg{min-height:30px;font-weight:700;margin:10px 0}
.msg.good{color:var(--grn)}.msg.bad{color:var(--org)}
.stage{position:relative;height:340px;background:var(--card);border:3px solid var(--line);border-radius:18px;overflow:hidden;user-select:none;-webkit-user-select:none;cursor:default}
.tg{position:absolute;width:90px;text-align:center;font-size:58px;line-height:1.1;cursor:pointer;animation:fl 2s ease-in-out infinite}
.tg i{display:block;font-style:normal;font-size:14px;font-weight:700;color:#fff;border-radius:99px;padding:2px 8px;margin-top:2px}
.tg.pop{animation:pop .45s forwards;pointer-events:none}
.tg.wig{animation:wig .35s}
@keyframes fl{50%{transform:translateY(-8px)}}
@keyframes pop{40%{transform:scale(1.5) rotate(10deg)}100%{transform:scale(0);opacity:0}}
@keyframes wig{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.shake{animation:wig .35s}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700}
.hud svg{width:56px}
.bar{height:14px;background:var(--card);border:3px solid var(--line);border-radius:99px;width:min(220px,50vw);overflow:hidden}
.bar div{height:100%;background:var(--grn);width:0;transition:width .3s}
.card{background:var(--card);border:3px solid var(--line);border-radius:22px;padding:22px;text-align:center;box-shadow:0 6px 0 var(--line)}
.big{font-size:72px}
.go{background:var(--sun);color:#26204a;border:3px solid var(--line);border-radius:14px;padding:10px 22px;font-weight:700;box-shadow:0 4px 0 var(--line);margin-top:10px}
.learn{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.learn .pc{cursor:default;text-align:center}.learn p{margin:0;font-size:15px}
.bigmouse{width:min(260px,70vw);display:block;margin:10px auto}
.bigmouse path{cursor:pointer;transition:fill .15s}
.opts{display:grid;gap:10px;margin-top:10px}

.f{display:grid;gap:12px;max-width:340px;margin:14px auto;text-align:left}
.f input,.f select,#fl{display:block;width:100%;font:inherit;padding:10px 12px;border:3px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin-top:4px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:16px;background:var(--card)}
#fl{width:auto;display:inline-block;margin:0}small{font-size:13px;color:var(--mute)}
th,td{border:2px solid var(--line);padding:6px 8px;text-align:left}
textarea{width:100%;height:140px;font:14px monospace;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:12px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:18px;z-index:9}
.ov .card{max-width:360px;width:100%}.bt{display:flex;gap:10px;justify-content:center;margin-top:10px}.bt .go{margin-top:0}
.ov input{font:inherit;width:100%;padding:10px 12px;border:3px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
.en{display:block}.id{display:block;font-size:.72em;font-weight:400;color:var(--mute);margin-top:2px}
body.noid .id{display:none}.tg i .id{color:#fff;font-size:11px;margin:0}
.blank{display:inline-block;min-width:90px;border-bottom:4px solid var(--blue);text-align:center;color:var(--blue);font-weight:700;padding:0 6px}.blank.f{border-bottom-color:var(--grn);color:var(--grn)}
.sent{font-size:clamp(20px,4.2vw,30px);line-height:1.6;margin:10px 0}.sent .id{line-height:1.5}
.mb.wide{width:100%;margin-top:14px}#lg{padding:4px 10px;margin-right:8px}
.pc{position:relative}.pc.sel{background:#bbf7d0;color:#14532d}.pc.sel::after{content:"✓";position:absolute;top:4px;right:10px;font-size:28px;color:#16a34a}
.opts button.dim{opacity:.4;text-decoration:line-through;cursor:not-allowed}.opts.lk{pointer-events:none}.opts.lk button:not(.dim){opacity:.6}
.go:disabled{opacity:.5;cursor:not-allowed}
.desk{position:relative;height:340px;border:3px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(135deg,#60a5fa,#a78bfa);user-select:none;-webkit-user-select:none;cursor:default}
.ic{position:absolute;width:104px;text-align:center;padding:6px;border:2px solid transparent;border-radius:8px;color:#fff;font-size:14px;text-shadow:0 1px 2px #0008}

.win{position:absolute;left:150px;right:12px;top:12px;background:#fff;color:#111;border:2px solid #333;border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:3}
.win .tb{display:flex;justify-content:space-between;align-items:center;background:#e5e7eb;padding:4px 8px;font-size:14px;font-weight:700}
.win .tb button{background:#ef4444;color:#fff;border:0;border-radius:6px;font-weight:700;padding:2px 10px}
.win .bd{padding:8px;height:210px;overflow:hidden}
.sh{border-collapse:collapse;width:100%;font-size:14px;background:#fff;color:#111}.sh th,.sh td{border:1px solid #d0d7de;padding:3px 8px;text-align:left;font-weight:400}.sh th{background:#f1f3f4;color:#555}
.cm{position:absolute;z-index:5;background:#fff;color:#111;border:1px solid #888;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.35);padding:4px 0;min-width:160px;font-size:15px}
.cm div{padding:4px 16px}.cm div:hover{background:#dbeafe}.cm hr{border:0;border-top:1px solid #ddd;margin:3px 0}
.ck-list{list-style:none;padding:0;margin:0 0 10px;display:grid;gap:6px}.ck-list li{background:var(--soft);border:3px solid var(--line);border-radius:12px;padding:6px 12px}.ck-list li.dn{background:#bbf7d0;color:#14532d}
.bk{position:absolute;top:70px;width:100px;height:100px;font-size:64px;display:grid;place-items:center;border:4px dashed var(--line);border-radius:18px}
.bl{position:absolute;top:84px;width:80px;height:80px;font-size:56px;display:grid;place-items:center;z-index:2}
.dg{cursor:grab;user-select:none;-webkit-user-select:none}.drg{cursor:grabbing;z-index:9;position:relative;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.bl.drg{position:absolute}.sel{outline:4px solid var(--blue);border-radius:14px}
.tgt{border:3px dashed var(--line);border-radius:14px;padding:10px;text-align:center;min-height:120px;display:grid;align-content:center;gap:6px;background:var(--card)}
.tgt.over,.bk.over{background:#bbf7d0;border-style:solid}.tgt .pc{padding:4px;box-shadow:none;border:0}
.tgt .en::first-letter,.tgt .id::first-letter{text-transform:uppercase}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.slot{min-width:110px;padding:10px;border:3px dashed var(--line);border-radius:14px;text-align:center;font-weight:700}
.slot.f{background:#bbf7d0;color:#14532d;border-style:solid}.slot.a{border-color:var(--blue)}.arw{font-size:26px}
.tx{font-size:clamp(28px,6vw,44px);font-family:"Courier New",monospace;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:18px;text-align:center;min-height:90px;margin:10px 0}
.tx .gr{color:var(--mute)}.cr{display:inline-block;width:0;overflow:hidden;height:1.15em;vertical-align:text-bottom;border-left:3px solid var(--org);margin:0 -1.5px;color:transparent;animation:bk 1s steps(1) infinite}.ch{display:inline-block;min-width:.55em;cursor:text}.ch:hover{background:#dbeafe;border-radius:4px}.tx.fx .ch{cursor:default}.tx.fx .ch:hover{background:none}@keyframes bk{50%{opacity:0}}
.er{background:#fecaca;color:#991b1b;border-radius:4px}.ok2{background:#bbf7d0;color:#14532d;border-radius:4px}
.kcap{display:inline-block;padding:12px 18px;border:3px solid var(--line);border-radius:10px;background:#e2e8f0;color:#26204a;font-weight:700;box-shadow:0 4px 0 var(--line);margin:4px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:12px 0}
.kb{display:grid;gap:5px;margin:10px 0;justify-content:center}.kr{display:flex;gap:5px;justify-content:center}.kr:nth-child(2){padding-left:14px}.kr:nth-child(3){padding-left:30px}
.k{position:relative;width:clamp(24px,5.4vw,42px);height:clamp(26px,5.4vw,42px);border:2px solid var(--line);border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:clamp(11px,2.3vw,17px);color:#26204a;opacity:.5}
.k.on{opacity:1;transform:scale(1.2);box-shadow:0 0 0 4px var(--blue);z-index:2}.k.bump::after{content:"";position:absolute;bottom:3px;left:32%;right:32%;border-bottom:3px solid #26204a}.k.sp{width:min(48vw,250px)}
.f-lp,.f-rp{background:#f9a8d4}.f-lr,.f-rr{background:#fdba74}.f-lm,.f-rm{background:#fde047}.f-li,.f-ri{background:#86efac}.f-th{background:#bae6fd}
.fing{text-align:center;font-weight:700;margin:4px 0}
.tv{font-size:clamp(26px,6vw,46px);font-family:"Courier New",monospace;letter-spacing:.08em;text-align:center;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:14px;margin:8px 0;min-height:76px;word-break:break-word}
.tv .d{color:var(--grn)}.tv .c{color:var(--org);border-bottom:4px solid var(--org)}.tv .p{color:var(--mute)}
.warn{background:#fde68a;color:#7c2d12;border:3px solid #f59e0b;border-radius:12px;padding:8px 12px;font-weight:700;text-align:center;margin:6px 0}
.pill{display:inline-block;padding:4px 14px;border:3px solid var(--line);border-radius:99px;font-weight:700;background:var(--card);margin:4px 0}.pill.on{background:#fde68a;color:#7c2d12}
.cin{display:block;width:100%;font:inherit;font-size:20px;padding:10px 12px;border:3px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin:4px 0 12px}.cl{display:block;font-weight:700}
.pf{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;color:#fff;font-weight:700;flex:none}
.opts button.pb{display:flex;align-items:center;gap:12px}
.av{width:64px;height:64px;border-radius:50%;object-fit:cover;flex:none}.card .av{display:block;margin:0 auto 6px}.card .ci{margin:0 auto 10px}
.ci{position:relative;display:inline-block;width:84px;height:84px}.ci svg{width:100%;height:100%}.ci img{position:absolute;right:-8px;bottom:-8px;width:42px;height:42px;border-radius:50%;border:3px solid #fff;background:#fff}
.opts button.ib{display:grid;place-items:center;padding:18px}.opts.row{grid-template-columns:repeat(2,1fr)}
.k.hit{transform:scale(1.25);box-shadow:0 0 0 4px var(--org);z-index:3;opacity:1}
.k small{position:absolute;top:1px;left:0;right:0;text-align:center;font-size:.68em;line-height:1}.k.sh{width:min(13vw,78px);background:#e2e8f0}
.ks .kr:nth-child(1){padding-left:0}.ks .kr:nth-child(2){padding-left:12px}.ks .kr:nth-child(3){padding-left:26px}.ks .kr:nth-child(4){padding-left:44px}.ks .kr:nth-child(5){padding-left:0}
.steps{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:6px;counter-reset:none}
.steps li{display:flex;gap:10px;align-items:center;font-weight:600;cursor:default}
.steps .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:14px}
.steps li.dn .n{background:var(--grn);color:#fff}.steps li.dn{opacity:.65}
.tg1{color:var(--blue);border-bottom:3px solid var(--blue)}.tg2{color:var(--org);border-bottom:3px solid var(--org)}
.cl.c1{color:var(--blue)}.cl.c2{color:var(--org)}
.cin.c1{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.22)}.cin.c2{border-color:var(--org);box-shadow:0 0 0 3px rgba(249,115,22,.22)}
:root{--soft:#e9e8e3}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--soft:#3b3470}}:root[data-theme="dark"]{--soft:#3b3470}
:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><b>⌨️ Computer Adventure 3</b><span><button id="lg" class="back" aria-pressed="true" title="Bahasa Indonesia">ID ✓</button><span id="sc">⭐ 0</span></span></header>
<main id="app"></main>
<script>

const A=document.getElementById('app'),SC=document.getElementById('sc');
let stars=0,done={},ms={},cur=0,flt='',me=null,et=null,tyP=0,tyC=0,tyM={};
const MM=[10,9,5,5,10,11],MN=['M1 Review','M2 Chrome Profile','M3 Copy & Paste','M4 Caps Lock','M5 Shift','M6 Typing Tutor'],KLS=['3 Aster','3 Gardenia','3 Gloxinia','3 Lavender'],MAX=50,KODE='guru123',KEY='pm3_results';let mem=[];
/* Alamat Google Apps Script (Web app, berakhiran /exec). Kosong = pengiriman ke Google Sheet mati. */
const SYNC='https://script.google.com/macros/s/AKfycbxlOaom3DHLCKEg9h_enfOiVeEi0oBqD9rrojtv7H-Vw1x1CRXlcvO20GWacvDeLaE/exec';
const TAB='Pertemuan 3'; /* nama tab di Google Sheet */
const $=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const bi=(en,id)=>`<span class="en">${en}</span>${id?`<span class="id">${id}</span>`:''}`;
const rec=()=>(ms[cur]=ms[cur]||{s:0,x:0});
const recalc=()=>{stars=0;for(const k in ms)stars+=ms[k].s;SC.textContent='⭐ '+stars};
const add=n=>{rec().s+=n||1;recalc()};
function snd(f,d){try{const c=snd.c||(snd.c=new(window.AudioContext||window.webkitAudioContext)());const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+(d||.12))}catch(e){}}
const ok=()=>{snd(660);setTimeout(()=>snd(880),90)},no=()=>{rec().x++;snd(180,.2)};
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const msg=(en,id,g)=>{const m=A.querySelector('#msg');if(m){m.innerHTML=bi(en,id);m.className='msg '+(g?'good':'bad')}};
const shake=el=>{el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')};
const stamp=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes())};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const goBack=()=>me?home():start();
const hdr=t=>`<div class="top"><button class="back" onclick="goBack()">⬅ Menu</button><span>${t}</span></div>`;
const setLang=on=>{document.body.classList.toggle('noid',!on);const b=document.getElementById('lg');b.textContent=on?'ID ✓':'ID ✕';b.setAttribute('aria-pressed',on)};
document.getElementById('lg').onclick=()=>setLang(document.body.classList.contains('noid'));

const e1=r=>r.e&&r.e.done?`The ${r.e.k} is used to ${r.e.kf}.`:'';
const e2=r=>r.e&&r.e.done?`One computer part that helps me complete a task is ${r.e.p} because ${r.e.pf}.`:'';
const accOf=r=>r.ty&&r.ty[0]?Math.round(r.ty[1]/r.ty[0]*100):'';
const topKeys=r=>Object.entries(r.tk||{}).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`${k===' '?'space':k}(${v})`).join(' ');
const HD=['Nama','Kelas'].concat(...MN.map(n=>[n+' Bintang',n+' Salah']),['Misi Selesai','Total Bintang','Maks','Exit Ticket 1','Exit Ticket 2','Exit Ticket Salah Pilih','Exit Ticket Jawaban Ditunjukkan','Tombol Diketik','Akurasi Mengetik (%)','Tombol Sering Salah','Waktu']);
const rowOf=r=>[r.nama,r.kelas].concat(...MM.map((_,i)=>{const m=(r.m||[])[i];return m&&(m.d||m.s||m.x)?[m.s,m.x]:['','']}),[r.misi||0,r.bintang,MAX,e1(r),e2(r),r.e&&r.e.done?r.e.x:'',r.e&&r.e.h?'Ya':'',r.ty?r.ty[0]:0,accOf(r),topKeys(r),r.waktu]);

/* kirim ke Google Sheet (antrean; dicoba ulang otomatis) */
const QK='pm3_queue';let qmem={},sending=0;
const qload=()=>{try{return JSON.parse(localStorage.getItem(QK)||'{}')}catch(e){return qmem}};
const qsave=q=>{qmem=q;try{localStorage.setItem(QK,JSON.stringify(q))}catch(e){}};
async function flush(){
 if(!SYNC||sending)return;sending=1;
 try{
  const q=qload();
  for(const id of Object.keys(q)){
   await fetch(SYNC,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({tab:TAB,head:['ID'].concat(HD),row:q[id]})});
   const q2=qload();if(JSON.stringify(q2[id])===JSON.stringify(q[id]))delete q2[id];qsave(q2);
  }
 }catch(e){}
 sending=0}
function queue(r){if(!SYNC)return;const q=qload();q[r.id]=[r.id].concat(rowOf(r));qsave(q);flush()}
setInterval(flush,30000);window.addEventListener('online',flush);

/* penyimpanan */
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return mem}};
const store=a=>{mem=a;try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}};
function save(){if(!me)return;const a=load(),r={id:me.id,nama:me.nama,kelas:me.kelas,bintang:stars,misi:Object.keys(done).length,m:[0,1,2,3,4,5].map(i=>({d:done[i]?1:0,s:(ms[i]||{}).s||0,x:(ms[i]||{}).x||0})),e:et,ty:[tyP,tyC],tk:tyM,waktu:stamp()};const j=a.findIndex(x=>x.id===me.id);j<0?a.push(r):a[j]=r;store(a);queue(r)}

/* awal */
function start(){
 done={};ms={};me=null;et=null;tyP=0;tyC=0;tyM={};window.onkeydown=null;window.onkeyup=null;recalc();setLang(false);
 A.innerHTML=`<div class="card"><div class="big">👋</div><h1>${bi('Hello! What is your name?','Halo! Siapa namamu?')}</h1><div class="f"><label>${bi('Name','Nama')}<input id="nm" maxlength="30" autocomplete="off"></label><label>${bi('Class','Kelas')}<select id="kl"><option value="">Choose / Pilih</option>${KLS.map(k=>`<option>${k}</option>`).join('')}</select></label></div><p id="msg" class="msg"></p><button class="go" id="go">${bi("Let's play!",'Mulai bermain')}</button></div><p style="text-align:center;margin-top:18px"><button class="back" id="gr">Untuk guru</button></p>`;
 const go=()=>{const nm=A.querySelector('#nm').value.trim(),kl=A.querySelector('#kl').value;if(!nm){msg('Please write your name.','Tulis namamu dulu ya.');return}if(!kl){msg('Please choose your class.','Pilih kelasmu dulu ya.');return}me={id:'S'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36),nama:nm,kelas:kl};save();home()};
 A.querySelector('#go').onclick=go;
 A.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')go()});
 A.querySelector('#gr').onclick=teacher;
}
function dlg(text,yes,label){
 const o=$(`<div class="ov"><div class="card"><p>${text}</p><div class="bt"></div></div></div>`);
 const y=$(`<button class="go">${label||'Ya'}</button>`),n=$('<button class="back">Batal</button>');
 y.onclick=()=>{o.remove();yes()};n.onclick=()=>o.remove();
 o.querySelector('.bt').append(y,n);document.body.append(o)}
function gantiSiswa(){stars?dlg('Ganti siswa? Skor ini sudah tersimpan.',start,'Ya, ganti'):start()}
function gate(){
 const o=$('<div class="ov"><div class="card"><p>Masukkan kode guru</p><input type="password" autocomplete="off"><p class="msg bad"></p><div class="bt"></div></div></div>');
 const i=o.querySelector('input'),e=o.querySelector('.msg');
 const go=()=>{if(i.value===KODE){o.remove();teacher(true)}else{e.textContent='Kode salah.';i.select()}};
 const y=$('<button class="go">Masuk</button>'),n=$('<button class="back">Batal</button>');
 y.onclick=go;n.onclick=()=>o.remove();i.onkeydown=ev=>{if(ev.key==='Enter')go()};
 o.querySelector('.bt').append(y,n);document.body.append(o);i.focus()}

/* guru */
function teacher(skip){
 if(skip!==true)return gate();
 const all=load(),a=all.filter(r=>!flt||r.kelas===flt);
 const mi=(r,i)=>(r.m||[])[i];
 const cell=(r,i)=>{const m=mi(r,i);return m&&m.d?`${m.s}/${MM[i]}<br><small>salah ${m.x}</small>`:m&&(m.s||m.x)?`${m.s}/${MM[i]}<br><small>salah ${m.x} · belum selesai</small>`:'–'};
 const avg=i=>{const v=a.map(r=>mi(r,i)).filter(m=>m&&m.d);return v.length?(v.reduce((t,m)=>t+m.s,0)/v.length).toFixed(1)+'/'+MM[i]:'–'};
 const rows=a.map(r=>`<tr><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td>${MM.map((_,i)=>`<td>${cell(r,i)}</td>`).join('')}<td><b>${r.bintang}/${MAX}</b></td><td>${accOf(r)===''?'–':accOf(r)+'%'}</td><td>${esc(topKeys(r))||'–'}</td></tr>`).join('')||'<tr><td colspan="11">Belum ada hasil.</td></tr>';
 const erows=a.map(r=>`<tr><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td>${esc(e1(r))||'–'}</td><td>${esc(e2(r))||'–'}</td><td>${r.e&&r.e.done?r.e.x+(r.e.h?' (jawaban ditunjukkan)':''):'–'}</td></tr>`).join('')||'<tr><td colspan="5">Belum ada hasil.</td></tr>';
 const sel=`<select id="fl"><option value="">Semua kelas</option>${KLS.map(k=>`<option${k===flt?' selected':''}>${k}</option>`).join('')}</select>`;
 const syTxt=SYNC?'Google Sheet: aktif. Menunggu terkirim: '+Object.keys(qload()).length+'.':'Google Sheet: belum diatur. Hasil hanya tersimpan di komputer ini.';
 A.innerHTML=`${hdr('Hasil Pertemuan 3')}<p>Kelas: ${sel}</p><div class="tw"><table><tr><th>Nama</th><th>Kelas</th>${MN.map(n=>`<th>${n}</th>`).join('')}<th>Total</th><th>Akurasi mengetik</th><th>Tombol sering salah</th></tr>${rows}<tr><td colspan="2"><i>Rata-rata</i></td>${MM.map((_,i)=>`<td><i>${avg(i)}</i></td>`).join('')}<td></td><td></td><td></td></tr></table></div><p class="intro">Angka = bintang didapat / maksimum. "salah" = jumlah pilihan atau tombol yang belum tepat. "belum selesai" = misi dihentikan di tengah jalan. "Akurasi mengetik" = persen tombol benar dari semua tombol yang ditekan di Misi 6. "Tombol sering salah" = tombol yang paling sering keliru, dengan jumlahnya.</p><h2>Exit Ticket &amp; Refleksi</h2><div class="tw"><table><tr><th>Nama</th><th>Kelas</th><th>Kalimat 1</th><th>Kalimat 2</th><th>Salah pilih</th></tr>${erows}</table></div><p class="intro">${syTxt}</p><p id="msg" class="msg"></p><button class="go" id="dl">Unduh CSV</button> <button class="go" id="sy"${SYNC?'':' disabled'}>Kirim ulang ke Google Sheet</button> <button class="go" id="cl">Hapus semua</button><div id="ta"></div>`;
 A.querySelector('#sy').onclick=async()=>{await flush();teacher(true)};
 A.querySelector('#fl').onchange=e=>{flt=e.target.value;teacher(true)};
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const hd=HD,data=a.map(rowOf);
 const csv='\uFEFF'+[hd].concat(data).map(r=>r.map(q).join(',')).join('\r\n');
 const tsv=[hd].concat(data).map(r=>r.map(v=>String(v).replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n');
 const showTxt=note=>{A.querySelector('#ta').innerHTML='<p>'+note+'</p><textarea readonly></textarea>';const t=A.querySelector('textarea');t.value=tsv;t.select()};
 A.querySelector('#dl').onclick=async()=>{
  const d=window.claude?await window.claude.use('downloads'):null;
  if(d){try{await d.save({filename:'hasil-pertemuan-3.csv',data:csv});msg('Tersimpan.','',1);return}catch(e){if(e&&e.code==='declined')return}}
  try{const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const l=document.createElement('a');l.href=u;l.download='hasil-pertemuan-3.csv';document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);msg('File hasil-pertemuan-3.csv diunduh. Cek folder Downloads.','',1)}catch(e){}
  showTxt('Kalau file belum terunduh, salin teks ini lalu tempel ke Google Sheets. Kolom akan terbagi otomatis:')};
 A.querySelector('#cl').onclick=()=>{dlg('Hapus semua hasil di komputer ini?',()=>{store([]);teacher(true)},'Ya, hapus')};
}

const ROWS=['qwertyuiop','asdfghjkl;','zxcvbnm,.'];
const FG={q:'lp',a:'lp',z:'lp',w:'lr',s:'lr',x:'lr',e:'lm',d:'lm',c:'lm',r:'li',f:'li',v:'li',t:'li',g:'li',b:'li',y:'ri',h:'ri',n:'ri',u:'ri',j:'ri',m:'ri',i:'rm',k:'rm',',':'rm',o:'rr',l:'rr','.':'rr',p:'rp',';':'rp',' ':'th'};
const FN={lp:['left pinky','kelingking kiri'],lr:['left ring finger','jari manis kiri'],lm:['left middle finger','jari tengah kiri'],li:['left pointer finger','jari telunjuk kiri'],ri:['right pointer finger','jari telunjuk kanan'],rm:['right middle finger','jari tengah kanan'],rr:['right ring finger','jari manis kanan'],rp:['right pinky','kelingking kanan'],th:['thumb (either one)','ibu jari (yang mana saja)']};
const fingerOf=c=>FN[FG[c]||'th'];
const fingerMsg=c=>{const f=fingerOf(c);return bi('Use your '+f[0]+'.','Pakai '+f[1]+'.')};
const kbHTML=(t,hit)=>{const ts=Array.isArray(t)?t:[t];
 return ROWS.map(r=>`<div class="kr">${[...r].map(c=>`<div class="k f-${FG[c]}${ts.includes(c)?' on':''}${c===hit?' hit':''}${c==='f'||c==='j'?' bump':''}">${c}</div>`).join('')}</div>`).join('')+`<div class="kr"><div class="k sp f-th${ts.includes(' ')?' on':''}${hit===' '?' hit':''}">Space</div></div>`};
const tvHTML=(T,k)=>[...T].map((c,i)=>`<span class="${i<k?'d':i===k?'c':'p'}">${c===' '?(i===k?'&nbsp;&nbsp;':'&nbsp;'):c}</span>`).join('');

/* menu */
function home(){
 if(!me)return start();
 window.onkeydown=null;window.onkeyup=null;save();
 const TT=['Review: Parts & Controls','Chrome Profile','Copy & Paste','Caps Lock','Shift','Typing Tutor'];
 const M=[['🧩',m1],['🌐',m2],['📋',m3],['🔠',m4],['⇧',m5],['⌨️',m6]];
 A.innerHTML=`<h1>${bi('Hello, '+esc(me.nama)+'!','Halo, '+esc(me.nama)+'!')}</h1><p class="sub">${bi('Choose a mission. Start from Mission 1 to 6.','Pilih satu misi. Kerjakan dari Misi 1 sampai 6.')}</p><div class="menu"></div><button class="mb wide" id="xt"><span>📝</span><b>Exit Ticket &amp; Reflection</b>${et?'<em>✅</em>':''}</button><p style="text-align:center;margin-top:18px"><button class="back" onclick="gantiSiswa()">Ganti siswa</button> <button class="back" onclick="teacher()">Untuk guru</button></p>`;
 const m=A.querySelector('.menu');
 M.forEach((x,i)=>{const b=$(`<button class="mb"><span>${x[0]}</span><b>Mission ${i+1}</b><small>${TT[i]}</small>${done[i]?'<em>✅</em>':''}</button>`);b.onclick=()=>{cur=i;ms[i]={s:0,x:0};recalc();x[1](i)};m.append(b)});
 A.querySelector('#xt').onclick=exitTicket;
 if(Object.keys(done).length>=6)m.before($(`<div class="card" style="margin-bottom:14px"><div class="big">🏆</div><h2>${bi('You are a Computer Pro! ⭐ '+stars+'/'+MAX,'Kamu Jagoan Komputer!')}</h2></div>`));
}
function finish(i,text){done[i]=1;add(2);ok();save();window.onkeydown=null;window.onkeyup=null;
 const all=Object.keys(done).length>=6;
 A.innerHTML=`<div class="card"><div class="big">${all?'🏆':'🎉'}</div><h2>${all?bi('You are a Computer Pro, '+esc(me.nama)+'!','Kamu Jagoan Komputer, '+esc(me.nama)+'!'):bi('Great job!','Hebat!')}</h2><p>${text}</p>${all?`<p><b>${bi('Final score: ⭐ '+stars+' / '+MAX,'Skor akhir')}</b></p>`:''}<button class="go" onclick="home()">${bi('Back to menu','Kembali ke menu')}</button></div>`}

/* pertanyaan pilihan (dua kesempatan) */
function ask(o,next){
 let lock=0,wrong=0;const bm={};
 A.innerHTML=`${hdr(o.title)}<h2>${o.q}</h2>${o.pic||''}<div class="opts${o.row?' row':''}"></div><p id="msg" class="msg"></p>`;
 const ops=A.querySelector('.opts');
 shuffle(o.opts.map((x,i)=>i)).forEach(i=>{const x=o.opts[i];const b=$(`<button class="${o.cls||''}">${x[1]}</button>`);bm[x[0]]=b;
  b.onclick=()=>{if(lock||b.disabled)return;
   if(x[0]===o.ok){lock=1;ok();add();b.classList.add('ok');msg('Correct! '+o.why[0],'Benar! '+o.why[1],1);setTimeout(next,2500);return}
   no();wrong++;lock=1;b.classList.add('dim');b.disabled=true;ops.classList.add('lk');shake(b);
   if(wrong>=2){bm[o.ok].classList.add('ok');msg('The answer is highlighted. '+o.why[0],'Jawabannya ditandai. '+o.why[1],1);setTimeout(next,3300)}
   else{msg(o.hint[0],o.hint[1]);setTimeout(()=>{lock=0;ops.classList.remove('lk')},1600)}};
  ops.append(b)})}

/* Misi 1: Review */
function flowTask(T,n,tot,title,next){
 const SL=[['Which part do I use to do this task?','Bagian mana yang kupakai untuk tugas ini?'],['Which part thinks and works on it?','Bagian mana yang berpikir dan mengolahnya?'],['Which part shows me the result?','Bagian mana yang menunjukkan hasilnya?']];
 const ans=[T[2],'cpu','monitor'],got=[];let s=0;
 const draw=()=>{
  A.innerHTML=`${hdr(title+' ('+n+'/'+tot+')')}<h2>${bi('Task: '+T[0],'Tugas: '+T[1])}</h2><div class="flow">${[0,1,2].map(j=>`<div class="slot ${j<s?'f':j===s?'a':''}">${j<s?P[got[j]].n:'?'}</div>${j<2?'<span class="arw">➜</span>':''}`).join('')}</div>${s<3?`<h2>${bi(SL[s][0],SL[s][1])}</h2><div class="grid"></div>`:''}<p id="msg" class="msg"></p>`;
  if(s>=3)return;
  const g=A.querySelector('.grid');
  Object.keys(P).forEach(k=>{const c=$(`<button class="pc">${P[k].svg}<b>${P[k].n}</b></button>`);

 const row=r=>`<div class="kr">${[...r].map(c=>`<div class="k f-${FG2[c]}${c===base?' on':''}${c==='f'||c==='j'?' bump':''}">${UNS[c]?`<small>${UNS[c]}</small>`:''}${c}</div>`).join('')}</div>`;

 pill(null);draw();window.onkeyup=pill;
 window.onkeydown=e=>{

    else if(e.key===want.toLowerCase()){no();msg('The letters are small. Press the Caps Lock key once, then try again.','Hurufnya kecil. Tekan tombol Caps Lock sekali, lalu coba lagi.')}

    else{no();msg('Find the letter "'+want+'".','Cari huruf "'+want+'".')}}
   else{
    if(e.key===o.fin){window.onkeydown=null;ok();add();msg('Great! Caps Lock is OFF.','Hebat! Caps Lock sudah mati.',1);setTimeout(next,1600)}
    else if(e.key===o.fin.toUpperCase())msg('Caps Lock is still ON. Press the Caps Lock key once.','Caps Lock masih menyala. Tekan tombol Caps Lock sekali.');
    else msg('Press the Caps Lock key, then the letter '+o.fin+'.','Tekan tombol Caps Lock, lalu huruf '+o.fin+'.')}
  }else{
   const want=T[k],low=want.toLowerCase(),up=want.toUpperCase(),isCap=want!==low,isSym=want in SYMS,need=isCap||isSym,cl=capsOn(e);
   if(e.key===want&&(!need||e.shiftKey)){k++;snd(520);draw();if(k>=T.length){window.onkeydown=null;ok();add();msg('Great! Well done.','Hebat! Kerja bagus.',1);setTimeout(next,1700)}}
   else{no();
    if(want===' ')msg('Press the SPACEBAR.','Tekan SPACEBAR.');
    else if(need&&e.key===want)msg('Hold SHIFT for this one.','Tahan SHIFT untuk yang ini.');

    else if(isSym&&e.key===SYMS[want])msg('Hold SHIFT while you press the '+SYMS[want]+' key.','Tahan SHIFT sambil menekan tombol '+SYMS[want]+'.');
    else if(!need&&up!==low&&e.key===up)msg(cl?'Caps Lock is ON, so all letters are BIG. Press the Caps Lock key to turn it off.':'This letter is small. Do not hold Shift.',cl?'Caps Lock menyala, jadi semua huruf besar. Tekan tombol Caps Lock untuk mematikannya.':'Huruf ini kecil. Jangan tahan Shift.');
    else if(!need&&e.shiftKey)msg('This one needs no Shift.','Yang ini tidak perlu Shift.');

 const Y=['!@#$%','^&*()'],C=['Dad','Sam and Dad','My name is '+Nm],S=['Wow!','Who is Dad?','Dad has a flask.'];
 const mk=(arr,lab,h,ins)=>arr.map((t,k)=>nx=>caseRound({mode:'shift',title:T+' · '+lab,idx:k+1,total:arr.length,text:t,h,ins},nx));
 A.querySelector('#st').onclick=()=>runRounds(i,[
  ...mk(Y,'Symbols',bi('Type the symbols. Hold Shift and press the number key.','Ketik simbol-simbol ini. Tahan Shift dan tekan tombol angkanya.'),bi('This is only practice. Find the glowing key and hold Shift.','Ini hanya latihan. Temukan tombol yang menyala dan tahan Shift.')),
  ...mk(C,'Capital letters',bi('Use Shift for the capital letters.','Pakai Shift untuk huruf kapital.'),bi('Hold Shift for a capital letter. Small letters need no Shift.','Tahan Shift untuk huruf kapital. Huruf kecil tidak perlu Shift.')),
  ...mk(S,'Sentences',bi('Type the sentence. Use Shift for ! and ?','Ketik kalimatnya. Pakai Shift untuk ! dan ?'),bi('The period (.) needs no Shift. Just press it.','Titik (.) tidak perlu Shift. Cukup tekan saja.'))],
  bi('You can use Shift for capital letters and symbols!','Kamu bisa memakai Shift untuk huruf kapital dan simbol!'))}

/* Misi 6: Copy dan Paste */
function cpRound(o,next){
 let st=0,lock=0;
 const S=[['Select the text in <b class="tg1">Box 1</b> (double-click or triple-click it).','Pilih teks di <b class="tg1">Kotak 1</b> (double click atau triple click).'],['Copy it.','Salin teksnya (copy).'],['Click inside <b class="tg2">Box 2</b>.','Klik di dalam <b class="tg2">Kotak 2</b>.'],['Paste it.','Tempel (paste).']];
 A.innerHTML=`${hdr('Mission 3 · Copy &amp; Paste ('+o.idx+'/'+o.total+')')}<h2>${o.h}</h2><p class="intro">${o.ins}</p><ul class="ck-list" id="ck"></ul><label class="cl c1">${bi('Box 1: copy from here','Kotak 1: salin dari sini')}<input id="b1" class="cin c1" readonly value="${esc(o.text)}"></label><label class="cl c2">${bi('Box 2: paste here','Kotak 2: tempel di sini')}<input id="b2" class="cin c2" autocomplete="off"></label><p id="msg" class="msg"></p>`;
 const b1=A.querySelector('#b1'),b2=A.querySelector('#b2');
 const ck=()=>{A.querySelector('#ck').innerHTML=S.map((t,j)=>`<li class="${j<st?'dn':''}">${j<st?'✅':'⬜'} ${bi(t[0],t[1])}</li>`).join('')};
 ck();
 b1.onselect=()=>{if(b1.selectionEnd-b1.selectionStart>0&&st<1){st=1;ck()}};
 b1.oncopy=()=>{if(st<2){st=2;ck()}};
 b2.onfocus=()=>{if(st===2){st=3;ck()}};
 b2.oninput=e=>{if(lock)return;
  if(e.inputType==='insertFromPaste'){
   if(b2.value===o.text){lock=1;st=4;ck();ok();add();msg('You pasted it! 🎉','Berhasil menempel! 🎉',1);setTimeout(next,1800)}
   else{no();b2.value='';st=0;ck();msg('That is not the text from Box 1. Select and copy Box 1 again.','Itu bukan teks dari Kotak 1. Pilih dan salin Kotak 1 lagi.')}}
  else{no();b2.value='';msg('Do not type. Use Paste: Ctrl + V, or right-click and choose Paste.','Jangan mengetik. Pakai Paste: Ctrl + V, atau klik kanan lalu pilih Paste.')}}}
function m3(i){
 const R=[{text:'apple',h:bi('Copy the word and paste it.','Salin kata itu lalu tempel.'),ins:bi('Use the keyboard: Ctrl + C to copy, Ctrl + V to paste.','Pakai keyboard: Ctrl + C untuk menyalin, Ctrl + V untuk menempel.')},
 {text:'mango',h:bi('Copy and paste again.','Salin dan tempel lagi.'),ins:bi('This time use right-click: choose Copy. Then right-click in Box 2 and choose Paste.','Kali ini pakai klik kanan: pilih Copy. Lalu klik kanan di Kotak 2 dan pilih Paste.')},
 {text:'i can copy and paste',h:bi('Copy the sentence and paste it.','Salin kalimat itu lalu tempel.'),ins:bi('Use any way you like.','Pakai cara mana saja yang kamu suka.')}];
 runRounds(i,R.map((r,k)=>nx=>cpRound({...r,idx:k+1,total:R.length},nx)),bi('You can copy and paste!','Kamu bisa menyalin dan menempel!'))}

/* Exit Ticket & Reflection */
const KEYS={caps:['Caps Lock key','make all letters capital until I press it again','membuat semua huruf menjadi kapital sampai kutekan lagi'],shift:['Shift key','make one capital letter while I hold it','membuat satu huruf kapital selama kutahan'],copy:['Ctrl + C','copy a word so I can use it again','menyalin kata agar bisa dipakai lagi'],paste:['Ctrl + V','put the copied word in a new place','menaruh kata yang disalin di tempat baru']};
const ROLES={monitor:['it shows information and pictures','ia menampilkan informasi dan gambar'],cpu:['it processes information and instructions','ia memproses informasi dan instruksi'],keyboard:['it helps me type and enter information','ia membantuku mengetik dan memasukkan informasi'],mouse:['it helps me point and select','ia membantuku menunjuk dan memilih']};
function exitTicket(){
 let kk=null,pk=null,tries=0,hinted=0;
 const N='Exit Ticket &amp; Reflection';
 const bl=t=>t?`<span class="blank f">${t}</span>`:'<span class="blank">&nbsp;</span>';
 const s1=f=>bi(`The ${bl(kk&&KEYS[kk][0])} is used to ${bl(f&&KEYS[kk][1])}.`,`${bl(kk&&KEYS[kk][0])} dipakai untuk ${bl(f&&KEYS[kk][2])}.`);
 const s2=f=>bi(`One computer part that helps me complete a task is ${bl(pk&&pl(pk))} because ${bl(f&&ROLES[pk][0])}.`,`Satu bagian komputer yang membantuku menyelesaikan tugas adalah ${bl(pk&&pl(pk))} karena ${bl(f&&ROLES[pk][1])}.`);
 const intro=`<p class="intro">${bi('No stars here. This shows what you learned.','Di sini tidak ada bintang. Ini untuk menunjukkan apa yang kamu pelajari.')}</p>`;
 const fnStep=(no_,sent,heading,correct,keys,txt,next)=>{
  let lock=0,wrong=0;const bm={};
  A.innerHTML=`${hdr(N+' ('+no_+'/4)')}${intro}<div class="sent" id="s">${sent(false)}</div><h2>${heading}</h2><div class="opts"></div><p id="msg" class="msg"></p>`;
  const o=A.querySelector('.opts'),fill=()=>{A.querySelector('#s').innerHTML=sent(true)};
  shuffle(keys).forEach(k=>{const b=$(`<button>${txt(k)}</button>`);bm[k]=b;
   b.onclick=()=>{if(lock||b.disabled)return;
    if(k===correct){lock=1;ok();b.classList.add('ok');fill();msg('Great!','Bagus!',1);setTimeout(next,1800);return}
    tries++;wrong++;lock=1;snd(180,.2);shake(b);b.classList.add('dim');b.disabled=true;o.classList.add('lk');
    if(wrong>=2){hinted=1;bm[correct].classList.add('ok');fill();msg('This is the answer. Let us keep going!','Ini jawabannya. Ayo lanjut!',1);setTimeout(next,3000)}
    else{msg('Read again. Think about what you practiced.','Baca lagi. Ingat apa yang tadi kamu latih.');setTimeout(()=>{lock=0;o.classList.remove('lk')},2000)}};
   o.append(b)})};
 const step1=()=>{
  A.innerHTML=`${hdr(N+' (1/4)')}${intro}<div class="sent">${s1(false)}</div><h2>${bi('Choose one key or shortcut to tell about.','Pilih satu tombol atau pintasan untuk diceritakan.')}</h2><div class="grid" style="grid-template-columns:repeat(2,1fr)"></div>`;
  const g=A.querySelector('.grid');
  Object.keys(KEYS).forEach(k=>{const c=$(`<button class="pc"><span class="kcap">${KEYS[k][0]}</span></button>`);c.onclick=()=>{kk=k;step2()};g.append(c)})};
 const step2=()=>fnStep(2,s1,bi('What is the '+KEYS[kk][0]+' used to do? Choose one.',KEYS[kk][0]+' dipakai untuk apa? Pilih satu.'),kk,Object.keys(KEYS),k=>bi(KEYS[k][1],KEYS[k][2]),step3);
 const step3=()=>{
  A.innerHTML=`${hdr(N+' (3/4)')}${intro}<div class="sent">${s2(false)}</div><h2>${bi('Choose one computer part that helps you complete a task.','Pilih satu bagian komputer yang membantumu menyelesaikan tugas.')}</h2><div class="grid"></div>`;
  const g=A.querySelector('.grid');
  Object.keys(P).forEach(k=>{const c=$(`<button class="pc">${P[k].svg}<b>${P[k].n}</b></button>`);c.onclick=()=>{pk=k;step4()};g.append(c)})};
 const step4=()=>fnStep(4,s2,bi('Why? Choose the reason that fits the '+pl(pk)+'.','Mengapa? Pilih alasan yang cocok untuk '+pl(pk)+'.'),pk,Object.keys(ROLES),k=>bi(ROLES[k][0],ROLES[k][1]),step5);
 const step5=()=>{
  et={k:KEYS[kk][0],kf:KEYS[kk][1],p:pl(pk),pf:ROLES[pk][0],x:tries,h:hinted,done:1};save();
  A.innerHTML=`<div class="card"><div class="big">📝</div><h2>${bi('My Exit Ticket','Tiket Keluarku')}</h2><div class="sent">${bi(`The <b>${KEYS[kk][0]}</b> is used to <b>${KEYS[kk][1]}</b>.`,`<b>${KEYS[kk][0]}</b> dipakai untuk <b>${KEYS[kk][2]}</b>.`)}</div><div class="sent">${bi(`One computer part that helps me complete a task is <b>${pl(pk)}</b> because <b>${ROLES[pk][0]}</b>.`,`Satu bagian komputer yang membantuku menyelesaikan tugas adalah <b>${pl(pk)}</b> karena <b>${ROLES[pk][1]}</b>.`)}</div><p>${bi('Ready to share? Read your sentences to the class!','Siap berbagi? Bacakan kalimatmu di depan kelas!')}</p><button class="go" onclick="home()">${bi('Back to menu','Kembali ke menu')}</button></div>`};
 step1()}
start();
</script></body></html>
