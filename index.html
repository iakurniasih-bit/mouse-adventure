<header><b>💬 Computer Adventure 4</b><span><button id="lg" class="back" aria-pressed="true" title="Bahasa Indonesia">ID ✓</button><span id="sc">⭐ 0</span></span></header>
<main id="app"></main>
<script>

const A=document.getElementById('app'),SC=document.getElementById('sc');
let stars=0,done={},ms={},cur=0,flt='',me=null,et=null,tyP=0,tyC=0,tyM={},prP=0,prC=0,prM={},rsS=0,tmr=null,tyH=0,dropOut=0,fb=0,draft=null,fmsg=null,mck=null,ezv=null,imp=null;
const MM=[7,9,9,6,7,7],MN=['M1 Ways to Communicate','M2 Parts of a Message','M3 Polite Words','M4 Write Your Message','M5 Check & Improve','M6 Typing Tutor'],KLS=['3 Aster','3 Gardenia','3 Gloxinia','3 Lavender'],MAX=45,KODE='guru123',KEY='pm4v2_results';let mem=[];
/* Alamat Google Apps Script (Web app, berakhiran /exec). Kosong = pengiriman ke Google Sheet mati. */
const SYNC='https://script.google.com/macros/s/AKfycbxlOaom3DHLCKEg9h_enfOiVeEi0oBqD9rrojtv7H-Vw1x1CRXlcvO20GWacvDeLaE/exec';
const TAB='Pertemuan 4'; /* nama tab di Google Sheet */
const $=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const bi=(en,id)=>`<span class="en">${en}</span>${id?`<span class="id">${id}</span>`:''}`;
const rec=()=>(ms[cur]=ms[cur]||{s:0,x:0});
const recalc=()=>{stars=0;for(const k in ms)stars+=ms[k].s;SC.textContent='⭐ '+stars};
const add=n=>{rec().s+=n||1;recalc()};
function snd(f,d){try{const c=snd.c||(snd.c=new(window.AudioContext||window.webkitAudioContext)());const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+(d||.12))}catch(e){}}
const ok=()=>{snd(660);setTimeout(()=>snd(880),90)},no=()=>{rec().x++;snd(180,.2)};
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const msg=(en,id,g)=>{const m=A.querySelector('#msg');if(m){m.innerHTML=bi(en,id);m.className='msg '+(g?'good':'bad')}};
const shake=el=>{el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')};
const stamp=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes())};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const goBack=()=>me?home():start();
const hdr=t=>`<div class="top"><button class="back" onclick="goBack()">⬅ Menu</button><span>${t}</span></div>`;
const setLang=on=>{document.body.classList.toggle('noid',!on);const b=document.getElementById('lg');b.textContent=on?'ID ✓':'ID ✕';b.setAttribute('aria-pressed',on)};
document.getElementById('lg').onclick=()=>setLang(document.body.classList.contains('noid'));

const e1=r=>r.e&&r.e.done?`I can use a computer to communicate by ${r.e.w}.`:'';
const e2=r=>r.e&&r.e.done?`A good digital message has ${r.e.b.join(', ')}.`:'';
const accOf=r=>r.ty&&r.ty[0]?Math.round(r.ty[1]/r.ty[0]*100):'';
const topK=o=>Object.entries(o||{}).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`${k===' '?'space':k}(${v})`).join(' ');
const topKeys=r=>topK(r.tk);
const accP=r=>r.pr&&r.pr[0]?Math.round(r.pr[1]/r.pr[0]*100):'';
const msgTxt=m=>m?[m.g,m.b,m.c].filter(Boolean).join(' '):'';
const ckv=(r,k)=>r.ck?(r.ck[k]?'Ya':'Tidak'):'';
const HD=['Nama','Kelas'].concat(...MN.map(n=>[n+' Bintang',n+' Salah']),['Misi Selesai','Total Bintang','Maks','Pesan Awal','Pesan Akhir','Cek Greeting','Cek Pesan','Cek Closing','Cek Kata Sopan','Pesan Jelas (Menurut Teman)','Pesan Diperbaiki','Exit Ticket 1','Exit Ticket 2','Exit Ticket Salah Pilih','Exit Ticket Jawaban Ditunjukkan','Tombol Diketik','Akurasi Mengetik (%)','Tombol Sering Salah','Latihan Bintang: Tombol Diketik','Latihan Bintang: Akurasi (%)','Latihan Bintang: Tombol Sering Salah','Rush Bintang (Latihan)','Petunjuk Keyboard Dibuka','Lepas Di Luar Target','Pakai Klik-Klik','Waktu']);
const rowOf=r=>[r.nama,r.kelas].concat(...MM.map((_,i)=>{const m=(r.m||[])[i];return m&&(m.d||m.s||m.x)?[m.s,m.x]:['','']}),[r.misi||0,r.bintang,MAX,msgTxt((r.mg||[])[0]),msgTxt((r.mg||[])[1]),ckv(r,'g'),ckv(r,'m'),ckv(r,'c'),ckv(r,'p'),r.ez||'',r.im===1?'Ya':r.im===0?'Tidak':'',e1(r),e2(r),r.e&&r.e.done?r.e.x:'',r.e&&r.e.h?'Ya':'',r.ty?r.ty[0]:0,accOf(r),topKeys(r),r.pr?r.pr[0]:0,accP(r),topK(r.pk),r.rs?r.rs[0]:0,r.hn||0,r.o||0,r.f?'Ya':'',r.waktu]);

/* kirim ke Google Sheet (antrean; dicoba ulang otomatis) */
const QK='pm4v2_queue';let qmem={},sending=0;
const qload=()=>{try{return JSON.parse(localStorage.getItem(QK)||'{}')}catch(e){return qmem}};
const qsave=q=>{qmem=q;try{localStorage.setItem(QK,JSON.stringify(q))}catch(e){}};
async function flush(){
 if(!SYNC||sending)return;sending=1;
 try{
  const q=qload();
  for(const id of Object.keys(q)){
   await fetch(SYNC,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({tab:TAB,head:['ID'].concat(HD),row:q[id]})});
   const q2=qload();if(JSON.stringify(q2[id])===JSON.stringify(q[id]))delete q2[id];qsave(q2);
  }
 }catch(e){}
 sending=0}
function queue(r){if(!SYNC)return;const q=qload();q[r.id]=[r.id].concat(rowOf(r));qsave(q);flush()}
setInterval(flush,30000);window.addEventListener('online',flush);

/* penyimpanan */
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return mem}};
const store=a=>{mem=a;try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}};
function save(){if(!me)return;const a=load(),r={id:me.id,nama:me.nama,kelas:me.kelas,bintang:stars,misi:Object.keys(done).length,m:[0,1,2,3,4,5].map(i=>({d:done[i]?1:0,s:(ms[i]||{}).s||0,x:(ms[i]||{}).x||0})),e:et,ty:[tyP,tyC],tk:tyM,pr:[prP,prC],pk:prM,rs:[rsS],hn:tyH,o:dropOut,f:fb,mg:[draft,fmsg],ck:mck,ez:ezv,im:imp,waktu:stamp()};const j=a.findIndex(x=>x.id===me.id);j<0?a.push(r):a[j]=r;store(a);queue(r)}

/* awal */
function start(){
 done={};ms={};me=null;et=null;tyP=0;tyC=0;tyM={};prP=0;prC=0;prM={};rsS=0;clearTimeout(tmr);tyH=0;dropOut=0;fb=0;draft=null;fmsg=null;mck=null;ezv=null;imp=null;window.onkeydown=null;window.onkeyup=null;recalc();setLang(false);
 A.innerHTML=`<div class="card fp"><div class="big">👋</div><h1>${bi('Hello! What is your name?','Halo! Siapa namamu?')}</h1><div class="f"><label>${bi('Name','Nama')}<input id="nm" maxlength="30" autocomplete="off"></label><label>${bi('Class','Kelas')}<select id="kl"><option value="">Choose / Pilih</option>${KLS.map(k=>`<option>${k}</option>`).join('')}</select></label></div><p id="msg" class="msg"></p><button class="go" id="go">${bi("Let's play!",'Mulai bermain')}</button></div><p style="text-align:center;margin-top:18px"><button class="back" id="gr">Untuk guru</button></p>`;
 const go=()=>{const nm=A.querySelector('#nm').value.trim(),kl=A.querySelector('#kl').value;if(!nm){msg('Please write your name.','Tulis namamu dulu ya.');return}if(!kl){msg('Please choose your class.','Pilih kelasmu dulu ya.');return}me={id:'S'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36),nama:nm,kelas:kl};save();home()};
 A.querySelector('#go').onclick=go;
 A.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')go()});
 A.querySelector('#gr').onclick=teacher;
}
function dlg(text,yes,label){
 const o=$(`<div class="ov"><div class="card"><p>${text}</p><div class="bt"></div></div></div>`);
 const y=$(`<button class="go">${label||'Ya'}</button>`),n=$('<button class="back">Batal</button>');
 y.onclick=()=>{o.remove();yes()};n.onclick=()=>o.remove();
 o.querySelector('.bt').append(y,n);document.body.append(o)}
function gantiSiswa(){stars?dlg('Ganti siswa? Skor ini sudah tersimpan.',start,'Ya, ganti'):start()}
function gate(){
 const o=$('<div class="ov"><div class="card"><p>Masukkan kode guru</p><input type="password" autocomplete="off"><p class="msg bad"></p><div class="bt"></div></div></div>');
 const i=o.querySelector('input'),e=o.querySelector('.msg');
 const go=()=>{if(i.value===KODE){o.remove();teacher(true)}else{e.textContent='Kode salah.';i.select()}};
 const y=$('<button class="go">Masuk</button>'),n=$('<button class="back">Batal</button>');
 y.onclick=go;n.onclick=()=>o.remove();i.onkeydown=ev=>{if(ev.key==='Enter')go()};
 o.querySelector('.bt').append(y,n);document.body.append(o);i.focus()}

/* guru */
function teacher(skip){
 if(skip!==true)return gate();
 const all=load(),a=all.filter(r=>!flt||r.kelas===flt);
 const mi=(r,i)=>(r.m||[])[i];
 const cell=(r,i)=>{const m=mi(r,i);return m&&m.d?`${m.s}/${MM[i]}<br><small>salah ${m.x}</small>`:m&&(m.s||m.x)?`${m.s}/${MM[i]}<br><small>salah ${m.x} · belum selesai</small>`:'–'};
 const avg=i=>{const v=a.map(r=>mi(r,i)).filter(m=>m&&m.d);return v.length?(v.reduce((t,m)=>t+m.s,0)/v.length).toFixed(1)+'/'+MM[i]:'–'};
 const rows=a.map(r=>`<tr><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td>${MM.map((_,i)=>`<td>${cell(r,i)}</td>`).join('')}<td><b>${r.bintang}/${MAX}</b></td></tr>`).join('')||'<tr><td colspan="9">Belum ada hasil.</td></tr>';
 const srows=a.map(r=>`<tr><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td>${accOf(r)===''?'–':accOf(r)+'%'}</td><td>${esc(topKeys(r))||'–'}</td><td>${accP(r)===''?'–':accP(r)+'%'}</td><td>${esc(topK(r.pk))||'–'}</td><td>${r.rs?r.rs[0]:'–'}</td><td>${r.hn||0}</td><td>${r.o||0}</td><td>${r.f?'Ya':'–'}</td></tr>`).join('')||'<tr><td colspan="10">Belum ada hasil.</td></tr>';
 const yn=(r,k)=>r.ck?(r.ck[k]?'✓':'✗'):'–';
 const mrows=a.map(r=>`<tr><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td>${esc(msgTxt((r.mg||[])[0]))||'–'}</td><td>${esc(msgTxt((r.mg||[])[1]))||'–'}</td><td>${['g','m','c','p'].map(k=>yn(r,k)).join(' ')}</td><td>${esc(r.ez||'–')} / ${r.im===1?'Ya':r.im===0?'Tidak':'–'}</td></tr>`).join('')||'<tr><td colspan="6">Belum ada hasil.</td></tr>';
 const erows=a.map(r=>`<tr><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td>${esc(e1(r))||'–'}</td><td>${esc(e2(r))||'–'}</td><td>${r.e&&r.e.done?r.e.x+(r.e.h?' (jawaban ditunjukkan)':''):'–'}</td></tr>`).join('')||'<tr><td colspan="5">Belum ada hasil.</td></tr>';
 const sel=`<select id="fl"><option value="">Semua kelas</option>${KLS.map(k=>`<option${k===flt?' selected':''}>${k}</option>`).join('')}</select>`;
 const syTxt=SYNC?'Google Sheet: aktif. Menunggu terkirim: '+Object.keys(qload()).length+'.':'Google Sheet: belum diatur. Hasil hanya tersimpan di komputer ini.';
 A.innerHTML=`${hdr('Hasil Pertemuan 4')}<p>Kelas: ${sel}</p><div class="tw"><table><tr><th>Nama</th><th>Kelas</th>${MN.map(n=>`<th>${n}</th>`).join('')}<th>Total</th></tr>${rows}<tr><td colspan="2"><i>Rata-rata</i></td>${MM.map((_,i)=>`<td><i>${avg(i)}</i></td>`).join('')}<td></td></tr></table></div><p class="intro">Angka = bintang didapat / maksimum. "salah" = jumlah pilihan atau tombol yang belum tepat. "belum selesai" = misi dihentikan di tengah jalan.</p><h2>Keterampilan: mengetik dan drag</h2><div class="tw"><table><tr><th>Nama</th><th>Kelas</th><th>Akurasi balon (Bagian 2)</th><th>Tombol sering salah (balon)</th><th>Akurasi latihan bintang (Bagian 1)</th><th>Tombol sering salah (bintang)</th><th>Rush bintang (Bagian 1)</th><th>Petunjuk keyboard dibuka</th><th>Lepas di luar target</th><th>Pakai klik-klik</th></tr>${srows}</table></div><p class="intro">Bagian 1 (latihan bintang) mengukur seberapa baik siswa mengingat letak tombol dari semua baris. Bagian 2 (balon) mengukur mengetik di baris tengah. "Rush bintang" = jumlah bintang yang ditangkap dalam tantangan 45 detik di Bagian 1 (skor terbaik). "Petunjuk keyboard dibuka" = berapa kali siswa memakai tombol Show keys atau petunjuk muncul otomatis (angka tinggi menandakan masih bergantung pada gambar keyboard). "Lepas di luar target" dan "Pakai klik-klik" menggambarkan kesulitan menyeret.</p><h2>Pesan siswa</h2><div class="tw"><table><tr><th>Nama</th><th>Kelas</th><th>Pesan awal (Misi 4)</th><th>Pesan akhir (Misi 5)</th><th>Cek pesan awal: greeting, pesan, closing, kata sopan</th><th>Jelas (teman) / diperbaiki</th></tr>${mrows}</table></div><h2>Exit Ticket &amp; Refleksi</h2><div class="tw"><table><tr><th>Nama</th><th>Kelas</th><th>Kalimat 1</th><th>Kalimat 2</th><th>Salah pilih</th></tr>${erows}</table></div><p class="intro">${syTxt}</p><p id="msg" class="msg"></p><button class="go" id="dl">Unduh CSV</button> <button class="go" id="sy"${SYNC?'':' disabled'}>Kirim ulang ke Google Sheet</button> <button class="go" id="cl">Hapus semua</button><div id="ta"></div>`;
 A.querySelector('#sy').onclick=async()=>{await flush();teacher(true)};
 A.querySelector('#fl').onchange=e=>{flt=e.target.value;teacher(true)};
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const hd=HD,data=a.map(rowOf);
 const csv='\uFEFF'+[hd].concat(data).map(r=>r.map(q).join(',')).join('\r\n');
 const tsv=[hd].concat(data).map(r=>r.map(v=>String(v).replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n');
 const showTxt=note=>{A.querySelector('#ta').innerHTML='<p>'+note+'</p><textarea readonly></textarea>';const t=A.querySelector('textarea');t.value=tsv;t.select()};
 A.querySelector('#dl').onclick=async()=>{
  const d=window.claude?await window.claude.use('downloads'):null;
  if(d){try{await d.save({filename:'hasil-pertemuan-4.csv',data:csv});msg('Tersimpan.','',1);return}catch(e){if(e&&e.code==='declined')return}}
  try{const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const l=document.createElement('a');l.href=u;l.download='hasil-pertemuan-4.csv';document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);msg('File hasil-pertemuan-4.csv diunduh. Cek folder Downloads.','',1)}catch(e){}
  showTxt('Kalau file belum terunduh, salin teks ini lalu tempel ke Google Sheets. Kolom akan terbagi otomatis:')};
 A.querySelector('#cl').onclick=()=>{dlg('Hapus semua hasil di komputer ini?',()=>{store([]);teacher(true)},'Ya, hapus')};
}

/* gambar */
let kb='';for(let r=0;r<3;r++)for(let c=0;c<8;c++)kb+=`<rect x="${12+c*9.5}" y="${34+r*10}" width="7.5" height="7.5" rx="1.5" fill="#94a3b8"/>`;
function mouse(hl,cls){const f=s=>hl===s?'#fde047':'#f1f5f9';
return `<svg viewBox="0 0 100 100" class="${cls||''}"><rect x="28" y="6" width="44" height="88" rx="22" fill="#f1f5f9" stroke="#475569" stroke-width="3"/><path data-s="L" d="M29.5 40V28A20.5 20.5 0 0 1 50 7.5V40Z" fill="${f('L')}" stroke="#475569" stroke-width="2.5"/><path data-s="R" d="M50 7.5A20.5 20.5 0 0 1 70.5 28V40H50Z" fill="${f('R')}" stroke="#475569" stroke-width="2.5"/><rect x="47" y="16" width="6" height="14" rx="3" fill="#475569"/></svg>`}
const P={
monitor:{n:'Monitor',f:['The monitor shows pictures and words. It is like the eyes of the computer!','Monitor menampilkan gambar dan tulisan. Seperti mata komputer!'],svg:'<svg viewBox="0 0 100 100"><rect x="8" y="10" width="84" height="58" rx="6" fill="#334155"/><rect x="14" y="16" width="72" height="46" rx="3" fill="#7dd3fc"/><rect x="44" y="68" width="12" height="14" fill="#64748b"/><rect x="28" y="82" width="44" height="7" rx="3" fill="#64748b"/></svg>'},
cpu:{n:'CPU',f:['The CPU is the brain of the computer. It is where the computer thinks!','CPU adalah otak komputer. Di sinilah komputer berpikir!'],svg:'<svg viewBox="0 0 100 100"><rect x="26" y="6" width="48" height="88" rx="5" fill="#cbd5e1" stroke="#475569" stroke-width="3"/><rect x="34" y="16" width="32" height="5" fill="#64748b"/><rect x="34" y="26" width="32" height="5" fill="#64748b"/><circle cx="50" cy="74" r="7" fill="#22c55e"/></svg>'},
keyboard:{n:'Keyboard',f:['The keyboard is used to type letters and numbers.','Keyboard dipakai untuk mengetik huruf dan angka.'],svg:`<svg viewBox="0 0 100 100"><rect x="5" y="26" width="90" height="48" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="3"/>${kb}<rect x="26" y="64" width="48" height="6" rx="2" fill="#94a3b8"/></svg>`},
mouse:{n:'Mouse',f:['The mouse moves the pointer on the screen and is used to click.','Mouse menggerakkan panah di layar dan dipakai untuk mengklik.'],svg:mouse('')}};

/* utilitas */
const SKIP=['Shift','CapsLock','Tab','Control','Alt','Meta'];
const bad=e=>e.repeat||e.ctrlKey||e.metaKey||e.altKey||SKIP.includes(e.key);
function runRounds(i,rs,fin){let n=0;const go=()=>{if(n>=rs.length){window.onkeydown=null;window.onkeyup=null;return finish(i,fin)}rs[n++](go)};go()}
const ROWS=['qwertyuiop','asdfghjkl;','zxcvbnm,.'];
const FG={q:'lp',a:'lp',z:'lp',w:'lr',s:'lr',x:'lr',e:'lm',d:'lm',c:'lm',r:'li',f:'li',v:'li',t:'li',g:'li',b:'li',y:'ri',h:'ri',n:'ri',u:'ri',j:'ri',m:'ri',i:'rm',k:'rm',',':'rm',o:'rr',l:'rr','.':'rr',p:'rp',';':'rp',' ':'th'};
const FN={lp:['left pinky','kelingking kiri'],lr:['left ring finger','jari manis kiri'],lm:['left middle finger','jari tengah kiri'],li:['left pointer finger','jari telunjuk kiri'],ri:['right pointer finger','jari telunjuk kanan'],rm:['right middle finger','jari tengah kanan'],rr:['right ring finger','jari manis kanan'],rp:['right pinky','kelingking kanan'],th:['thumb (either one)','ibu jari (yang mana saja)']};
const fingerOf=c=>FN[FG[c]||'th'];
const fingerMsg=c=>{const f=fingerOf(c);return bi('Use your '+f[0]+'.','Pakai '+f[1]+'.')};
const kbHTML=(t,hit)=>{const ts=Array.isArray(t)?t:[t];
 return ROWS.map(r=>`<div class="kr">${[...r].map(c=>`<div class="k f-${FG[c]}${ts.includes(c)?' on':''}${c===hit?' hit':''}${c==='f'||c==='j'?' bump':''}">${c}</div>`).join('')}</div>`).join('')+`<div class="kr"><div class="k sp f-th${ts.includes(' ')?' on':''}">Space</div></div>`};
const capsOn=e=>!!(e&&e.getModifierState&&e.getModifierState('CapsLock'));
const capsBanner=e=>{const b=A.querySelector('#cap');if(b)b.style.display=capsOn(e)?'block':'none'};
const chk=m=>({g:/^\s*(hi|hello|dear|hey)\b[\s,]*[a-z]/i.test(m.g||''),m:/\S+\s+\S+\s+\S+/.test(m.b||''),c:/(see you|from|bye|goodbye|your friend|thank)/i.test(m.c||''),p:/(please|thank|thanks|sorry|excuse me)/i.test([m.g,m.b,m.c].join(' '))});

/* utilitas drag & drop */
const at=(e,ts)=>ts.find(t=>{const r=t.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom});
function dnd(items,targets,drop){
 let sel=null;
 const pick=x=>{sel=x;items.forEach(i=>i.classList.toggle('sel',i===x))};
 items.forEach(it=>{

 const step2=()=>{
  sel=[];
  A.innerHTML=`${hdr(N+' (2/2)')}${intro}<div class="sent" id="s">${s2([])}</div><h2>${bi('Tap the three parts of a good digital message.','Ketuk tiga bagian pesan digital yang baik.')}</h2><div class="opts"></div><p id="msg" class="msg"></p><button class="go" id="dn" disabled>${bi('Done','Selesai')}</button>`;
  const o=A.querySelector('.opts'),dn=A.querySelector('#dn'),bs=[];
  const upd=()=>{A.querySelector('#s').innerHTML=s2(sel);bs.forEach((b,k)=>b.classList.toggle('ok',sel.includes(k)));dn.disabled=sel.length!==3};
  PARTS.forEach((p,k)=>{const b=$(`<button>${bi(p[0],p[1])}</button>`);bs.push(b);
   b.onclick=()=>{const j=sel.indexOf(k);if(j>=0)sel.splice(j,1);else if(sel.length<3)sel.push(k);upd()};o.append(b)});
  dn.onclick=()=>{
   const right=sel.every(k=>PARTS[k][2]);
   if(right){ok();step3(sel.slice())}
   else{tries++;snd(180,.2);
    if(tries>=2){hinted=1;sel=[0,1,2];upd();msg('This is the answer. Let us keep going!','Ini jawabannya. Ayo lanjut!',1);setTimeout(()=>step3([0,1,2]),2800)}
    else{msg('Not quite. Think about the parts of a message.','Belum tepat. Pikirkan bagian-bagian pesan.');sel=[];upd()}}}};
 const step3=a=>{
  et={w:WAYS[wy][0],b:a.map(k=>PARTS[k][0]),x:tries,h:hinted,done:1};save();
  A.innerHTML=`<div class="card"><div class="big">📝</div><h2>${bi('My Exit Ticket','Tiket Keluarku')}</h2><div class="sent">${bi(`I can use a computer to communicate by <b>${WAYS[wy][0]}</b>.`,`Aku bisa memakai komputer untuk berkomunikasi dengan <b>${WAYS[wy][1]}</b>.`)}</div><div class="sent">${bi(`A good digital message has <b>${a.map(k=>PARTS[k][0]).join(', ')}</b>.`,`Pesan digital yang baik punya <b>${a.map(k=>PARTS[k][1]).join(', ')}</b>.`)}</div><p>${bi('Ready to share? Read your sentences to the class!','Siap berbagi? Bacakan kalimatmu di depan kelas!')}</p><button class="go" onclick="home()">${bi('Back to menu','Kembali ke menu')}</button></div>`};
 step1()}
start();
</script></body></html>
