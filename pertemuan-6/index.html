<header><b>🎨 Computer Adventure 6</b><span><button id="lg" class="back" aria-pressed="true" title="Bahasa Indonesia">ID ✓</button><span id="sc">⭐ 0</span></span></header>
<main id="app"></main>
<script>
const A=document.getElementById('app'),SC=document.getElementById('sc');
let stars=0,done={},ms={},cur=0,flt='',me=null,et=null,plan=null,mk=[],chk=null,sv=null,fb=0,dropOut=0;
const MN=['M1 Poster Recipe dan Right Pictures','M2 Find It with Keywords','M3 Plan My Poster','M4 Make It in Canva','M5 Think Before I Share','M6 Save My Poster'],KLS=['3 Aster','3 Gardenia','3 Gloxinia','3 Lavender'],KODE='guru123',KEY='pm6_results';let mem=[];
/* Alamat Google Apps Script (Web app, berakhiran /exec). Kosong = pengiriman ke Google Sheet mati. */
const SYNC='https://script.google.com/macros/s/AKfycbxlOaom3DHLCKEg9h_enfOiVeEi0oBqD9rrojtv7H-Vw1x1CRXlcvO20GWacvDeLaE/exec';
const TAB='Pertemuan 6'; /* nama tab di Google Sheet */
const $=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const bi=(en,id)=>`<span class="en">${en}</span>${id?`<span class="id">${id}</span>`:''}`;
const rec=()=>(ms[cur]=ms[cur]||{s:0,x:0});
const recalc=()=>{stars=0;for(const k in ms)stars+=ms[k].s;SC.textContent='⭐ '+stars};
const add=n=>{rec().s+=n||1;recalc()};
function snd(f,d){try{const c=snd.c||(snd.c=new(window.AudioContext||window.webkitAudioContext)());const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+(d||.12))}catch(e){}}
const ok=()=>{snd(660);setTimeout(()=>snd(880),90)},no=()=>{rec().x++;snd(180,.2)};
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const fnOf=(n,k)=>String(n).replace(/\s+/g,'')+'_'+String(k).replace(/\s+/g,'')+'_poster';

const HD=['Nama','Kelas','M1 Salah','M2 Salah','Topik Poster','Judul','Pesan Utama','Pengingat','Gambar','Kata Kunci','Plan Self-Check (dari 3)','Langkah Canva Dicentang (dari 5)','Nama File','Poster Check (Ya atau Perbaiki)','Poster Check: yang kuubah atau kuperiksa','Poster Check: karena','Link Poster (opsional)','Status Poster','Next time I will','Cari File Di Canva','Exit: My poster teaches others to','Exit: I showed respectful digital communication by','Exit: Penilaian Diri (dari 4)','Misi Selesai','Lepas Di Luar Target','Waktu'];
const rowOf=r=>{const p=r.p||{},c=r.c||{},v=r.v||{},e=r.e||{},m=r.m||[];const x=i=>m[i]&&(m[i].d||m[i].x)?m[i].x:'';
 return [r.nama,r.kelas,x(0),x(1),p.topic||'',p.title||'',p.msg||'',(p.rem||[]).join(' | '),(p.pics||[]).join(' | '),p.keys||'',p.sc||'',(r.k||[]).filter(Boolean).length||'',fnOf(r.nama,r.kelas),(c.t||[]).map((y,i)=>CHKW[i]+': '+(y?'Ya':'Perbaiki')).join(', '),c.what||'',c.because||'',v.link||'',v.status||'',v.next||'',v.searched?'Ya':'',e.a||'',e.b||'',e.self?e.self.length:'',r.misi||0,r.o||0,r.waktu]};

const QK='pm6_queue';let qmem={},sending=0;
const qload=()=>{try{return JSON.parse(localStorage.getItem(QK)||'{}')}catch(e){return qmem}};
const qsave=q=>{qmem=q;try{localStorage.setItem(QK,JSON.stringify(q))}catch(e){}};
async function flush(){
 if(!SYNC||sending)return;sending=1;
 try{
  const q=qload();
  for(const id of Object.keys(q)){
   await fetch(SYNC,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({tab:TAB,head:['ID'].concat(HD),row:q[id]})});
   const q2=qload();if(JSON.stringify(q2[id])===JSON.stringify(q[id]))delete q2[id];qsave(q2);
  }
 }catch(e){}
 sending=0}
function queue(r){if(!SYNC)return;const q=qload();q[r.id]=[r.id].concat(rowOf(r));qsave(q);flush()}
setInterval(flush,30000);window.addEventListener('online',flush);

/* penyimpanan */
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return mem}};
const store=a=>{mem=a;try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}};
function save(){if(!me)return;const a=load(),r={id:me.id,nama:me.nama,kelas:me.kelas,bintang:stars,misi:Object.keys(done).length,m:[0,1,2,3,4,5].map(i=>({d:done[i]?1:0,s:(ms[i]||{}).s||0,x:(ms[i]||{}).x||0})),p:plan,k:mk,c:chk,v:sv,e:et,o:dropOut,waktu:stamp()};const j=a.findIndex(x=>x.id===me.id);j<0?a.push(r):a[j]=r;store(a);queue(r)}

/* awal */
function start(){
 done={};ms={};me=null;et=null;plan=null;mk=[];chk=null;sv=null;dropOut=0;fb=0;window.onkeydown=null;window.onkeyup=null;recalc();setLang(false);
 A.innerHTML=`<div class="card fp"><div class="big">👋</div><h1>${bi('Hello! What is your name?','Halo! Siapa namamu?')}</h1><div class="f"><label>${bi('Name','Nama')}<input id="nm" maxlength="30" autocomplete="off"></label><label>${bi('Class','Kelas')}<select id="kl"><option value="">Choose / Pilih</option>${KLS.map(k=>`<option>${k}</option>`).join('')}</select></label></div><p id="msg" class="msg"></p><button class="go" id="go">${bi("Let's play!",'Mulai bermain')}</button></div><p style="text-align:center;margin-top:18px"><button class="back" id="gr">Untuk guru</button></p>`;
 const go=()=>{const nm=A.querySelector('#nm').value.trim(),kl=A.querySelector('#kl').value;if(!nm){msg('Please write your name.','Tulis namamu dulu ya.');return}if(!kl){msg('Please choose your class.','Pilih kelasmu dulu ya.');return}me={id:'S'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36),nama:nm,kelas:kl};save();home()};
 A.querySelector('#go').onclick=go;

}
function dlg(text,yes,label){

 const y=$('<button class="go">Masuk</button>'),n=$('<button class="back">Batal</button>');

/* guru */
function teacher(skip){
 if(skip!==true)return gate();
 const all=load(),a=all.filter(r=>!flt||r.kelas===flt);
 const mi=(r,i)=>(r.m||[])[i];
 const cell=(r,i)=>{const m=mi(r,i);return m&&m.d?'✅'+(i<2?'<br><small>salah '+m.x+'</small>':''):'–'};
 const rows=a.map(r=>`<tr><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td>${[0,1,2,3,4,5].map(i=>`<td>${cell(r,i)}</td>`).join('')}<td>${esc((r.p||{}).topic||'–')}</td><td>${esc((r.v||{}).status||'–')}</td></tr>`).join('')||'<tr><td colspan="9">Belum ada hasil.</td></tr>';
 const prow=a.map(r=>{const p=r.p||{},v=r.v||{},c=r.c||{};const lk=v.link?`<a href="${esc(v.link)}" target="_blank" rel="noopener">buka</a>`:'–';return `<tr><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td>${esc(p.title||'–')}</td><td>${esc(p.msg||'–')}</td><td>${esc((p.rem||[]).join(' | ')||'–')}</td><td>${esc(p.keys||'–')}</td><td>${esc(c.what?c.what+': '+c.because:'–')}</td><td>${lk}</td><td>${esc(v.next||'–')}</td></tr>`}).join('')||'<tr><td colspan="9">Belum ada hasil.</td></tr>';
 const erow=a.map(r=>{const e=r.e||{};return `<tr><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td>${esc(e.a||'–')}</td><td>${esc(e.b||'–')}</td><td>${e.self?e.self.length+'/4':'–'}</td></tr>`}).join('')||'<tr><td colspan="5">Belum ada hasil.</td></tr>';
 const sel=`<select id="fl"><option value="">Semua kelas</option>${KLS.map(k=>`<option${k===flt?' selected':''}>${k}</option>`).join('')}</select>`;
 const syTxt=SYNC?'Google Sheet: aktif. Menunggu terkirim: '+Object.keys(qload()).length+'.':'Google Sheet: belum diatur. Hasil hanya tersimpan di komputer ini.';
 A.innerHTML=`${hdr('Hasil Pertemuan 6')}<p>Kelas: ${sel}</p><div class="tw"><table><tr><th>Nama</th><th>Kelas</th>${MN.map(n=>`<th>${n}</th>`).join('')}<th>Topik</th><th>Status poster</th></tr>${rows}</table></div><p class="intro">✅ = misi selesai. "salah" = jumlah pilihan yang belum tepat (Misi 1 dan 2).</p><h2>Rencana, poster, dan link</h2><div class="tw"><table><tr><th>Nama</th><th>Kelas</th><th>Judul</th><th>Pesan utama</th><th>Pengingat</th><th>Kata kunci</th><th>Yang diubah atau diperiksa</th><th>Link</th><th>Next time I will</th></tr>${prow}</table></div><h2>Exit Ticket dan Refleksi</h2><div class="tw"><table><tr><th>Nama</th><th>Kelas</th><th>My poster teaches others to…</th><th>I showed respectful digital communication by…</th><th>Penilaian diri</th></tr>${erow}</table></div><p class="intro">${syTxt}</p><p id="msg" class="msg"></p><button class="go" id="dl">Unduh CSV</button> <button class="go" id="sy"${SYNC?'':' disabled'}>Kirim ulang ke Google Sheet</button> <button class="go" id="cl">Hapus semua</button><div id="ta"></div>`;
 A.querySelector('#sy').onclick=async()=>{await flush();teacher(true)};
 A.querySelector('#fl').onchange=e=>{flt=e.target.value;teacher(true)};
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const hd=HD,data=a.map(rowOf);

  const d=window.claude?await window.claude.use('downloads'):null;
  if(d){try{await d.save({filename:'hasil-pertemuan-6.csv',data:csv});msg('Tersimpan.','',1);return}catch(e){if(e&&e.code==='declined')return}}
  try{const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const l=document.createElement('a');l.href=u;l.download='hasil-pertemuan-6.csv';document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);msg('File hasil-pertemuan-6.csv diunduh. Cek folder Downloads.','',1)}catch(e){}
  showTxt('Kalau file belum terunduh, salin teks ini lalu tempel ke Google Sheets. Kolom akan terbagi otomatis:')};
 A.querySelector('#cl').onclick=()=>{dlg('Hapus semua hasil di komputer ini?',()=>{store([]);teacher(true)},'Ya, hapus')};
}

/* utilitas drag & drop */
const at=(e,ts)=>ts.find(t=>{const r=t.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom});
function dnd(items,targets,drop){
 let sel=null;
 const pick=x=>{sel=x;items.forEach(i=>i.classList.toggle('sel',i===x))};
 items.forEach(it=>{
  let on=0,sx=0,sy=0;
  it.classList.add('dg');it.style.touchAction='none';
  it.onpointerdown=e=>{if(e.button!==0||it.dataset.lock)return;e.preventDefault();on=1;sx=e.clientX;sy=e.clientY;it.dataset.mv='';it.setPointerCapture(e.pointerId);it.classList.add('drg');it.style.transition='none'};
  it.onpointermove=e=>{if(!on)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)it.dataset.mv='1';it.style.transform=`translate(${dx}px,${dy}px)`;const t=at(e,targets);targets.forEach(x=>x.classList.toggle('over',x===t))};
  const end=e=>{if(!on)return;on=0;it.classList.remove('drg');const t=at(e,targets);targets.forEach(x=>x.classList.remove('over'));it.style.transition='transform .25s';it.style.transform='';if(it.dataset.mv)drop(it,t||null)};
  it.onpointerup=end;it.onpointercancel=end;
  it.onclick=()=>{if(fb&&!it.dataset.lock&&!it.dataset.mv)pick(it)};
 });
 targets.forEach(t=>t.onclick=()=>{if(fb&&sel){const i=sel;pick(null);drop(i,t)}});
}
function showFb(){const w=A.querySelector('#fbw');if(!w||fb)return;w.innerHTML=`<button class="go" id="fbb">${bi('Try click-and-click','Coba klik-klik')}</button>`;A.querySelector('#fbb').onclick=()=>{fb=1;w.innerHTML='';msg('Click the item, then click where it goes.','Klik benda itu, lalu klik tempat tujuannya.',1)}}


/* menu */

 const TT=['Poster Recipe & Right Pictures','Find It with Keywords','Plan My Poster','Make It in Canva','Think Before I Share','Save My Poster'];

 A.innerHTML=`<h1>${bi('Hello, '+esc(me.nama)+'!','Halo, '+esc(me.nama)+'!')}</h1><p class="sub">${bi('Choose a mission. Start from Mission 1 to 6.','Pilih satu misi. Kerjakan dari Misi 1 sampai 6.')}</p><div class="menu"></div><button class="mb wide" id="xt"><span>📝</span><b>Exit Ticket &amp; Reflection</b>${et?'<em>✅</em>':''}</button><p style="text-align:center;margin-top:18px"><button class="back" onclick="gantiSiswa()">Ganti siswa</button> <button class="back" onclick="teacher()">Untuk guru</button></p>`;
 const m=A.querySelector('.menu');
 M.forEach((x,i)=>{const b=$(`<button class="mb"><span>${x[0]}</span><b>Mission ${i+1}</b><small>${TT[i]}</small>${done[i]?'<em>✅</em>':''}</button>`);b.onclick=()=>{cur=i;ms[i]={s:0,x:0};recalc();x[1](i)};m.append(b)});

 if(Object.keys(done).length>=6)m.before($(`<div class="card fp" style="margin-bottom:14px"><div class="big">🏆</div><h2>${bi('You made a respectful poster!','Kamu membuat poster yang santun!')}</h2></div>`));
}
function finish(i,text){done[i]=1;ok();save();window.onkeydown=null;window.onkeyup=null;
 const all=Object.keys(done).length>=6;
 A.innerHTML=`<div class="card"><div class="big">${all?'🏆':'🎉'}</div><h2>${all?bi('You made a respectful poster, '+esc(me.nama)+'!','Kamu membuat poster yang santun, '+esc(me.nama)+'!'):bi('Great job!','Hebat!')}</h2><p>${text}</p><button class="go" onclick="home()">${bi('Back to menu','Kembali ke menu')}</button></div>`}
function runRounds(i,rs,fin){let n=0;const go=()=>{if(n>=rs.length){window.onkeydown=null;window.onkeyup=null;return finish(i,fin)}rs[n++](go)};go()}
/* pertanyaan pilihan (dua kesempatan) */
function ask(o,next){
 let lock=0,wrong=0;const bm={};
 A.innerHTML=`${hdr(o.title)}<h2>${o.q}</h2>${o.pic||''}<div class="opts${o.row?' row':''}${o.three?' three':''}"></div><p id="msg" class="msg"></p>`;
 const ops=A.querySelector('.opts');

const balPos=(n,len)=>{const a=[];for(let k=0;k<n;k++)a.push(k%len);return shuffle(a)};
const ordered=R=>{const g={};R.forEach((r,k)=>{(g[r.opts.length]=g[r.opts.length]||[]).push(k)});const pos={};
 Object.keys(g).forEach(L=>{const ps=balPos(g[L].length,+L);g[L].forEach((k,j)=>{pos[k]=ps[j]})});

 A.innerHTML=`${hdr(T)}<h2>${bi('Make your poster in Canva.','Buat posterku di Canva.')}</h2><p class="intro">${bi('Keep this page open. Work in Canva, then come back to tick each step.','Biarkan halaman ini terbuka. Bekerja di Canva, lalu kembali untuk mencentang tiap langkah.')}</p><div id="sl"></div><div class="msgbox"><p>${bi('When you finish: make it easy to read, then go to Mission 5.','Kalau sudah: buat mudah dibaca, lalu lanjut ke Misi 5.')}</p></div><button class="go" id="dn">${bi('Done for now','Selesai untuk sekarang')}</button>`;
 const sl=A.querySelector('#sl');
 S.forEach((st,k)=>{const d=$(`<div class="stp"><h3><button class="ck2">☐</button> ${k+1}. ${bi(st.t[0],st.t[1])}</h3><p>${bi(st.h[0],st.h[1])}</p><div class="cp"></div></div>`);
  const cp=d.querySelector('.cp');if(st.c===null)cp.innerHTML=`<p class="fing">${none}</p>`;else st.c.forEach(t=>cp.append(copyRow(t)));
  const ck=d.querySelector('.ck2');ck.onclick=()=>{mk[k]=mk[k]?0:1;ck.textContent=mk[k]?'☑':'☐';d.classList.toggle('on',!!mk[k])};sl.append(d)});
 A.querySelector('#dn').onclick=()=>finish(i,bi('Keep going in Canva. Then check your poster in Mission 5.','Lanjutkan di Canva. Lalu periksa posterku di Misi 5.'))}

/* ===== Misi 5: Think Before I Share ===== */
function m5(i){
 const T='Mission 5 · Think Before I Share';
 chk={t:[],what:'',because:''};const ans=[];
 A.innerHTML=`${hdr(T)}<h2>${bi('Poster Check','Pemeriksaan Poster')}</h2><p class="intro">${bi('Look at your poster in Canva. Answer each question.','Lihat posterku di Canva. Jawab tiap pertanyaan.')}</p><div id="rows"></div><p id="msg" class="msg"></p><div id="sec" style="display:none"></div>`;
 const rows=A.querySelector('#rows');
 CHK.forEach((c,k)=>{const d=$(`<div class="stp"><h3>${bi(c[0],c[1])}</h3><p>${bi(c[2],c[3])}</p><div class="opts row"><button>${bi('✅ Yes','✅ Ya')}</button><button>${bi('✏️ I will fix it','✏️ Aku akan memperbaikinya')}</button></div></div>`);
  const [y,n]=d.querySelectorAll('button');
  const set=v=>{ans[k]=v;y.classList.toggle('ok',v===1);n.classList.toggle('ok',v===0);d.classList.toggle('on',v===1);if(ans.filter(x=>x!==undefined).length===CHK.length)second()};
  y.onclick=()=>set(1);n.onclick=()=>{set(0);msg('Go to Canva and fix it. Then come back.','Pergi ke Canva dan perbaiki. Lalu kembali ke sini.')};rows.append(d)});
 let shown=false;
 const second=()=>{chk.t=ans.slice();const sec=A.querySelector('#sec');if(shown){return}shown=true;sec.style.display='block';
  let what=-1;
  sec.innerHTML=`<h2>${bi('One thing I changed or checked was…','Satu hal yang kuubah atau kuperiksa adalah…')}</h2><div class="opts"></div><div class="sent">${bi('…because…','…karena…')}</div><input class="ti" id="ti" maxlength="120" autocomplete="off"><button class="go" id="dn" disabled>${bi('Done','Selesai')}</button>`;
  const o=sec.querySelector('.opts'),ti=sec.querySelector('#ti'),dn=sec.querySelector('#dn'),bs=[];
  const upd=()=>{dn.disabled=!(what>=0&&wc(ti.value)>=3)};
  const WHAT=[['my message','pesanku'],['my words','kata-kataku'],['my picture','gambarku'],['my personal information','informasi pribadiku'],['my final check','pemeriksaan akhirku']];
  CHK.forEach((c,k)=>{const b=$(`<button>${bi(WHAT[k][0],WHAT[k][1])}</button>`);b.onclick=()=>{what=k;bs.forEach((x,j)=>x.classList.toggle('ok',j===k));upd()};bs.push(b);o.append(b)});
  ti.oninput=upd;dn.onclick=()=>{chk.what=WHAT[what][0];chk.because=ti.value.trim();finish(i,bi('You checked your poster before sharing!','Kamu memeriksa posterku sebelum dibagikan!'))};
  sec.scrollIntoView({behavior:'smooth'})}}

/* ===== Misi 6: Save My Poster ===== */
function m6(i){
 const T='Mission 6 · Save My Poster';
 const fn=fnOf(me.nama,me.kelas);sv={link:'',status:'',next:'',searched:0,shared:0};
 const tk=[0,0,0];
 A.innerHTML=`${hdr(T)}<h2>${bi('Save your poster so you can find it next time.','Simpan posterku supaya mudah ditemukan lagi.')}</h2><p class="intro">${bi('Do this even if your poster is not finished.','Kerjakan ini walaupun posterku belum selesai.')}</p><div id="sl"></div><div class="stp"><h3>${bi('My poster is…','Posterku…')}</h3><div class="opts row"><button id="fin">${bi('✅ finished','✅ sudah selesai')}</button><button id="nf">${bi('⏳ not finished yet','⏳ belum selesai')}</button></div></div><div class="stp"><h3>${bi('Next time I will…','Lain kali aku akan…')}</h3><input class="ti" id="ti" maxlength="120" autocomplete="off"></div><p id="msg" class="msg"></p><button class="go" id="dn" disabled>${bi('Done','Selesai')}</button>`;
 const sl=A.querySelector('#sl'),dn=A.querySelector('#dn'),ti=A.querySelector('#ti');
 const S=[
  {t:['Share, copy the link','Bagikan, salin tautan'],h:['In Canva click Share. Click Copy link. Allow view access.','Di Canva klik Share. Klik Copy link. Izinkan akses lihat (view).']},
  {t:['Paste the link in the spreadsheet','Tempel tautan di spreadsheet'],h:['Open the spreadsheet. Find your name. Paste your link.','Buka spreadsheet. Cari namamu. Tempel tautanmu.'],link:1},
  {t:['Find your file','Temukan filemu'],h:['Go to the Canva home page. Search for your file name. Can you see your poster?','Buka halaman utama Canva. Cari nama filemu. Apakah posterku terlihat?'],c:[fn]}];
 S.forEach((st,k)=>{const d=$(`<div class="stp"><h3><button class="ck2">☐</button> ${k+1}. ${bi(st.t[0],st.t[1])}</h3><p>${bi(st.h[0],st.h[1])}</p><div class="cp"></div></div>`);
  const cp=d.querySelector('.cp');if(st.c)st.c.forEach(t=>cp.append(copyRow(t)));
  if(st.link){cp.innerHTML=`<input class="ti" id="lk" maxlength="300" autocomplete="off" placeholder="https://www.canva.com/…"><p class="intro">${bi('Optional: paste your link here too. It is a copy for your teacher.','Opsional: tempel tautanmu di sini juga. Ini salinan untuk gurumu.')}</p>`}
  const ck=d.querySelector('.ck2');ck.onclick=()=>{tk[k]=tk[k]?0:1;ck.textContent=tk[k]?'☑':'☐';d.classList.toggle('on',!!tk[k])};sl.append(d)});
 const fin=A.querySelector('#fin'),nf=A.querySelector('#nf');
 const upd=()=>{dn.disabled=!(sv.status&&wc(ti.value)>=2)};
 fin.onclick=()=>{sv.status='Sudah selesai';fin.classList.add('ok');nf.classList.remove('ok');upd()};
 nf.onclick=()=>{sv.status='Belum selesai';nf.classList.add('ok');fin.classList.remove('ok');upd()};
 ti.oninput=upd;
 dn.onclick=()=>{const lk=A.querySelector('#lk');const v=lk?lk.value.trim():'';if(v&&!/^https?:\/\//i.test(v)){msg('A link starts with https://. Paste the link or clear the box.','Tautan diawali https://. Tempel tautannya atau kosongkan kotaknya.');return}
  sv.link=v;sv.next=ti.value.trim();sv.shared=tk[0]&&tk[1]?1:0;sv.searched=tk[2]?1:0;finish(i,bi('Your poster is saved. You can find it next time!','Posterku sudah tersimpan. Kamu bisa menemukannya lagi nanti!'))}}

/* ===== Exit Ticket & Reflection ===== */
function exitTicket(){
 const N='Exit Ticket &amp; Reflection';let a='',b='',self=[];
 const nav=n=>hdr(N+' ('+n+'/3)');
 const idea=bi('Write it in your own words.','Tulis dengan kata-katamu sendiri.');
 const s1=()=>typedStep({nav:nav(1),heading:bi('Finish the sentence.','Lengkapi kalimatnya.'),prompt:bi('My poster teaches others to…','Posterku mengajak orang lain untuk…'),hint:idea,get:()=>a,set:v=>{a=v},min:3,next:s2});
 const s2=()=>typedStep({nav:nav(2),heading:bi('Finish the sentence.','Lengkapi kalimatnya.'),prompt:bi('I showed respectful digital communication by…','Aku menunjukkan komunikasi digital yang santun dengan…'),hint:idea,get:()=>b,set:v=>{b=v},min:3,next:s3});
 const s3=()=>{
  A.innerHTML=`${nav(3)}<h2>${bi('Check what you did.','Centang yang sudah kamu lakukan.')}</h2><div class="opts"></div><button class="go" id="dn">${bi('Done','Selesai')}</button>`;
  const o=A.querySelector('.opts'),bs=[];
  SELF.forEach((s,k)=>{const x=$(`<button>☐ ${bi(s[0],s[1])}</button>`);x.onclick=()=>{const j=self.indexOf(k);if(j>=0)self.splice(j,1);else self.push(k);x.classList.toggle('ok',self.includes(k));x.firstChild.textContent=self.includes(k)?'☑ ':'☐ '};bs.push(x);o.append(x)});
  A.querySelector('#dn').onclick=fin};
 const fin=()=>{
  et={a,b,self:self.slice(),done:1};save();
  A.innerHTML=`<div class="card"><div class="big">📝</div><h2>${bi('My Exit Ticket','Tiket Keluarku')}</h2><div class="sent">${bi('My poster teaches others to <b>'+esc(a)+'</b>.','Posterku mengajak orang lain untuk <b>'+esc(a)+'</b>.')}</div><div class="sent">${bi('I showed respectful digital communication by <b>'+esc(b)+'</b>.','Aku menunjukkan komunikasi digital yang santun dengan <b>'+esc(b)+'</b>.')}</div><div class="sent">${bi('I checked: <b>'+(self.map(k=>SELF[k][0]).join(' ')||'–')+'</b>','Aku mencentang: <b>'+(self.map(k=>SELF[k][1]).join(' ')||'–')+'</b>')}</div><p>${bi('Ready to share? Read your sentences to the class!','Siap berbagi? Bacakan kalimatmu di depan kelas!')}</p><button class="go" onclick="home()">${bi('Back to menu','Kembali ke menu')}</button></div>`};
 s1()}
start();
</script></body></html>
