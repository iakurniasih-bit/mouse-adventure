:focus-visible{outline:4px solid var(--blue);outline-offset:2px}

.segs{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}

</style></head><body>
<header><b>🤝 Computer Adventure 5</b><span><button id="lg" class="back" aria-pressed="true" title="Bahasa Indonesia">ID ✓</button><span id="sc">⭐ 0</span></span></header>
<main id="app"></main>
<script>
const A=document.getElementById('app'),SC=document.getElementById('sc');
let stars=0,done={},ms={},cur=0,flt='',me=null,et=null,sch=[],xr='',fb=0,dropOut=0;
const MM=[7,9,5,9,8,7],MN=['M1 Kind or Unkind','M2 Respectful or Disrespectful','M3 Find the Words','M4 STOP THINK CHECK SEND','M5 Send Change or Ask for Help','M6 Make It Kind'],KLS=['3 Aster','3 Gardenia','3 Gloxinia','3 Lavender'],MAX=45,KODE='guru123',KEY='pm5_results';let mem=[];
/* Alamat Google Apps Script (Web app, berakhiran /exec). Kosong = pengiriman ke Google Sheet mati. */
const SYNC='https://script.google.com/macros/s/AKfycbxlOaom3DHLCKEg9h_enfOiVeEi0oBqD9rrojtv7H-Vw1x1CRXlcvO20GWacvDeLaE/exec';
const TAB='Pertemuan 5'; /* nama tab di Google Sheet */
const $=h=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const bi=(en,id)=>`<span class="en">${en}</span>${id?`<span class="id">${id}</span>`:''}`;
const rec=()=>(ms[cur]=ms[cur]||{s:0,x:0});
const recalc=()=>{stars=0;for(const k in ms)stars+=ms[k].s;SC.textContent='⭐ '+stars};
const add=n=>{rec().s+=n||1;recalc()};
function snd(f,d){try{const c=snd.c||(snd.c=new(window.AudioContext||window.webkitAudioContext)());const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+(d||.12))}catch(e){}}
const ok=()=>{snd(660);setTimeout(()=>snd(880),90)},no=()=>{rec().x++;snd(180,.2)};
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const msg=(en,id,g)=>{const m=A.querySelector('#msg');if(m){m.innerHTML=bi(en,id);m.className='msg '+(g?'good':'bad')}};
const shake=el=>{el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')};
const stamp=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes())};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const goBack=()=>me?home():start();
const hdr=t=>`<div class="top"><button class="back" onclick="goBack()">⬅ Menu</button><span>${t}</span></div>`;
const setLang=on=>{document.body.classList.toggle('noid',!on);const b=document.getElementById('lg');b.textContent=on?'ID ✓':'ID ✕';b.setAttribute('aria-pressed',on)};
document.getElementById('lg').onclick=()=>setLang(document.body.classList.contains('noid'));

const KEYSC='CSHCHS';
const MEANS=[['using kind and polite words and thinking about other people','menggunakan kata yang baik dan sopan serta memikirkan orang lain',1],['typing as fast as I can','mengetik secepat yang aku bisa',0],['sending a message before I think','mengirim pesan sebelum aku berpikir',0]];
const RULES=[['Use kind words.','Gunakan kata-kata yang baik.'],['Think before sending.','Pikir sebelum mengirim.'],['Check my message.','Periksa pesanku.'],['Respect other people.','Hargai orang lain.'],['Ask an adult when I am unsure.','Tanya orang dewasa saat aku ragu.']];
const eDone=r=>r.e&&r.e.done;
const scTxt=r=>r.sc?r.sc.split('').map(c=>({S:'Send',C:'Change',H:'Ask for Help'}[c]||'-')).join(', '):'';
const scOk=r=>r.sc?r.sc.split('').filter((c,k)=>c===KEYSC[k]).length:'';
const HD=['Nama','Kelas'].concat(...MN.map(n=>[n+' Bintang',n+' Salah']),['Misi Selesai','Total Bintang','Maks','Pilihan Skenario Misi 5 (kunci: Change, Send, Ask for Help, Change, Ask for Help, Send)','Skenario Benar Pada Pilihan Pertama (dari 6)','Misi 2: I think this message is disrespectful because…','Exit Ticket: Respectful digital communication means','Exit Ticket: 3 Aturan Penting','Exit Ticket: Before I send a digital message, I should','Exit Ticket: Respectful communication is important because','Exit Ticket Salah Pilih','Lepas Di Luar Target','Pakai Klik-Klik','Waktu']);
const rowOf=r=>[r.nama,r.kelas].concat(...MM.map((_,i)=>{const m=(r.m||[])[i];return m&&(m.d||m.s||m.x)?[m.s,m.x]:['','']}),[r.misi||0,r.bintang,MAX,scTxt(r),scOk(r),r.xr||'',eDone(r)?MEANS[r.e.m][0]:'',eDone(r)?r.e.r.map(k=>RULES[k][0]).join(' | '):'',eDone(r)?r.e.b:'',eDone(r)?r.e.w:'',eDone(r)?r.e.x:'',r.o||0,r.f?'Ya':'',r.waktu]);

/* kirim ke Google Sheet (antrean; dicoba ulang otomatis) */
const QK='pm5_queue';let qmem={},sending=0;
const qload=()=>{try{return JSON.parse(localStorage.getItem(QK)||'{}')}catch(e){return qmem}};
const qsave=q=>{qmem=q;try{localStorage.setItem(QK,JSON.stringify(q))}catch(e){}};
async function flush(){
 if(!SYNC||sending)return;sending=1;
 try{
  const q=qload();
  for(const id of Object.keys(q)){
   await fetch(SYNC,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({tab:TAB,head:['ID'].concat(HD),row:q[id]})});
   const q2=qload();if(JSON.stringify(q2[id])===JSON.stringify(q[id]))delete q2[id];qsave(q2);
  }
 }catch(e){}
 sending=0}
function queue(r){if(!SYNC)return;const q=qload();q[r.id]=[r.id].concat(rowOf(r));qsave(q);flush()}
setInterval(flush,30000);window.addEventListener('online',flush);

/* penyimpanan */
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return mem}};
const store=a=>{mem=a;try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}};
function save(){if(!me)return;const a=load(),r={id:me.id,nama:me.nama,kelas:me.kelas,bintang:stars,misi:Object.keys(done).length,m:[0,1,2,3,4,5].map(i=>({d:done[i]?1:0,s:(ms[i]||{}).s||0,x:(ms[i]||{}).x||0})),e:et,sc:sch.join(''),xr:xr,o:dropOut,f:fb,waktu:stamp()};const j=a.findIndex(x=>x.id===me.id);j<0?a.push(r):a[j]=r;store(a);queue(r)}

/* awal */
function start(){
 done={};ms={};me=null;et=null;sch=[];xr='';dropOut=0;fb=0;window.onkeydown=null;window.onkeyup=null;recalc();setLang(false);
 A.innerHTML=`<div class="card fp"><div class="big">👋</div><h1>${bi('Hello! What is your name?','Halo! Siapa namamu?')}</h1><div class="f"><label>${bi('Name','Nama')}<input id="nm" maxlength="30" autocomplete="off"></label><label>${bi('Class','Kelas')}<select id="kl"><option value="">Choose / Pilih</option>${KLS.map(k=>`<option>${k}</option>`).join('')}</select></label></div><p id="msg" class="msg"></p><button class="go" id="go">${bi("Let's play!",'Mulai bermain')}</button></div><p style="text-align:center;margin-top:18px"><button class="back" id="gr">Untuk guru</button></p>`;
 const go=()=>{const nm=A.querySelector('#nm').value.trim(),kl=A.querySelector('#kl').value;if(!nm){msg('Please write your name.','Tulis namamu dulu ya.');return}if(!kl){msg('Please choose your class.','Pilih kelasmu dulu ya.');return}me={id:'S'+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36),nama:nm,kelas:kl};save();home()};
 A.querySelector('#go').onclick=go;
 A.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')go()});
 A.querySelector('#gr').onclick=teacher;
}
function dlg(text,yes,label){
 const o=$(`<div class="ov"><div class="card"><p>${text}</p><div class="bt"></div></div></div>`);
 const y=$(`<button class="go">${label||'Ya'}</button>`),n=$('<button class="back">Batal</button>');
 y.onclick=()=>{o.remove();yes()};n.onclick=()=>o.remove();
 o.querySelector('.bt').append(y,n);document.body.append(o)}
function gantiSiswa(){stars?dlg('Ganti siswa? Skor ini sudah tersimpan.',start,'Ya, ganti'):start()}
function gate(){
 const o=$('<div class="ov"><div class="card"><p>Masukkan kode guru</p><input type="password" autocomplete="off"><p class="msg bad"></p><div class="bt"></div></div></div>');
 const i=o.querySelector('input'),e=o.querySelector('.msg');
 const go=()=>{if(i.value===KODE){o.remove();teacher(true)}else{e.textContent='Kode salah.';i.select()}};
 const y=$('<button class="go">Masuk</button>'),n=$('<button class="back">Batal</button>');
 y.onclick=go;n.onclick=()=>o.remove();i.onkeydown=ev=>{if(ev.key==='Enter')go()};
 o.querySelector('.bt').append(y,n);document.body.append(o);i.focus()}


/* guru */
function teacher(skip){
 if(skip!==true)return gate();
 const all=load(),a=all.filter(r=>!flt||r.kelas===flt);
 const mi=(r,i)=>(r.m||[])[i];
 const cell=(r,i)=>{const m=mi(r,i);return m&&m.d?`${m.s}/${MM[i]}<br><small>salah ${m.x}</small>`:m&&(m.s||m.x)?`${m.s}/${MM[i]}<br><small>salah ${m.x} · belum selesai</small>`:'–'};
 const avg=i=>{const v=a.map(r=>mi(r,i)).filter(m=>m&&m.d);return v.length?(v.reduce((t,m)=>t+m.s,0)/v.length).toFixed(1)+'/'+MM[i]:'–'};
 const rows=a.map(r=>`<tr><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td>${MM.map((_,i)=>`<td>${cell(r,i)}</td>`).join('')}<td><b>${r.bintang}/${MAX}</b></td></tr>`).join('')||'<tr><td colspan="9">Belum ada hasil.</td></tr>';
 const srows=a.map(r=>`<tr><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td>${esc(scTxt(r))||'–'}</td><td>${r.sc?scOk(r)+'/6':'–'}</td><td>${r.o||0}</td><td>${r.f?'Ya':'–'}</td></tr>`).join('')||'<tr><td colspan="6">Belum ada hasil.</td></tr>';
 const erows=a.map(r=>`<tr><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td>${esc(r.xr||'–')}</td><td>${eDone(r)?esc(MEANS[r.e.m][0]):'–'}</td><td>${eDone(r)?esc(r.e.r.map(k=>RULES[k][0]).join(' | ')):'–'}</td><td>${eDone(r)?esc(r.e.b):'–'}</td><td>${eDone(r)?esc(r.e.w):'–'}</td></tr>`).join('')||'<tr><td colspan="7">Belum ada hasil.</td></tr>';
 const sel=`<select id="fl"><option value="">Semua kelas</option>${KLS.map(k=>`<option${k===flt?' selected':''}>${k}</option>`).join('')}</select>`;
 const syTxt=SYNC?'Google Sheet: aktif. Menunggu terkirim: '+Object.keys(qload()).length+'.':'Google Sheet: belum diatur. Hasil hanya tersimpan di komputer ini.';
 A.innerHTML=`${hdr('Hasil Pertemuan 5')}<p>Kelas: ${sel}</p><div class="tw"><table><tr><th>Nama</th><th>Kelas</th>${MN.map(n=>`<th>${n}</th>`).join('')}<th>Total</th></tr>${rows}<tr><td colspan="2"><i>Rata-rata</i></td>${MM.map((_,i)=>`<td><i>${avg(i)}</i></td>`).join('')}<td></td></tr></table></div><p class="intro">Angka = bintang didapat / maksimum. "salah" = jumlah pilihan yang belum tepat. "belum selesai" = misi dihentikan di tengah jalan.</p><h2>Misi 5: Send, Change, or Ask for Help</h2><div class="tw"><table><tr><th>Nama</th><th>Kelas</th><th>Pilihan pertama (skenario 1-6)</th><th>Benar pada pilihan pertama</th><th>Lepas di luar target</th><th>Pakai klik-klik</th></tr>${srows}</table></div><p class="intro">Kunci jawaban: Change, Send, Ask for Help, Change, Ask for Help, Send. "Benar pada pilihan pertama" menunjukkan siswa memutuskan tanpa dibantu petunjuk.</p><h2>Exit Ticket &amp; Refleksi</h2><div class="tw"><table><tr><th>Nama</th><th>Kelas</th><th>Misi 2: alasan (typed)</th><th>Respectful digital communication means…</th><th>3 aturan penting</th><th>Before I send a digital message, I should…</th><th>Respectful communication is important because…</th></tr>${erows}</table></div><p class="intro">${syTxt}</p><p id="msg" class="msg"></p><button class="go" id="dl">Unduh CSV</button> <button class="go" id="sy"${SYNC?'':' disabled'}>Kirim ulang ke Google Sheet</button> <button class="go" id="cl">Hapus semua</button><div id="ta"></div>`;
 A.querySelector('#sy').onclick=async()=>{await flush();teacher(true)};
 A.querySelector('#fl').onchange=e=>{flt=e.target.value;teacher(true)};
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const hd=HD,data=a.map(rowOf);
 const csv='\uFEFF'+[hd].concat(data).map(r=>r.map(q).join(',')).join('\r\n');
 const tsv=[hd].concat(data).map(r=>r.map(v=>String(v).replace(/[\t\r\n]+/g,' ')).join('\t')).join('\n');
 const showTxt=note=>{A.querySelector('#ta').innerHTML='<p>'+note+'</p><textarea readonly></textarea>';const t=A.querySelector('textarea');t.value=tsv;t.select()};
 A.querySelector('#dl').onclick=async()=>{
  const d=window.claude?await window.claude.use('downloads'):null;
  if(d){try{await d.save({filename:'hasil-pertemuan-5.csv',data:csv});msg('Tersimpan.','',1);return}catch(e){if(e&&e.code==='declined')return}}
  try{const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const l=document.createElement('a');l.href=u;l.download='hasil-pertemuan-5.csv';document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);msg('File hasil-pertemuan-5.csv diunduh. Cek folder Downloads.','',1)}catch(e){}
  showTxt('Kalau file belum terunduh, salin teks ini lalu tempel ke Google Sheets. Kolom akan terbagi otomatis:')};
 A.querySelector('#cl').onclick=()=>{dlg('Hapus semua hasil di komputer ini?',()=>{store([]);teacher(true)},'Ya, hapus')};
}

/* utilitas drag & drop */
const at=(e,ts)=>ts.find(t=>{const r=t.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom});
function dnd(items,targets,drop){
 let sel=null;
 const pick=x=>{sel=x;items.forEach(i=>i.classList.toggle('sel',i===x))};
 items.forEach(it=>{
  let on=0,sx=0,sy=0;
  it.classList.add('dg');it.style.touchAction='none';
  it.onpointerdown=e=>{if(e.button!==0||it.dataset.lock)return;e.preventDefault();on=1;sx=e.clientX;sy=e.clientY;it.dataset.mv='';it.setPointerCapture(e.pointerId);it.classList.add('drg');it.style.transition='none'};
  it.onpointermove=e=>{if(!on)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)it.dataset.mv='1';it.style.transform=`translate(${dx}px,${dy}px)`;const t=at(e,targets);targets.forEach(x=>x.classList.toggle('over',x===t))};
  const end=e=>{if(!on)return;on=0;it.classList.remove('drg');const t=at(e,targets);targets.forEach(x=>x.classList.remove('over'));it.style.transition='transform .25s';it.style.transform='';if(it.dataset.mv)drop(it,t||null)};
  it.onpointerup=end;it.onpointercancel=end;
  it.onclick=()=>{if(fb&&!it.dataset.lock&&!it.dataset.mv)pick(it)};
 });
 targets.forEach(t=>t.onclick=()=>{if(fb&&sel){const i=sel;pick(null);drop(i,t)}});
}
function showFb(){const w=A.querySelector('#fbw');if(!w||fb)return;w.innerHTML=`<button class="go" id="fbb">${bi('Try click-and-click','Coba klik-klik')}</button>`;A.querySelector('#fbb').onclick=()=>{fb=1;w.innerHTML='';msg('Click the item, then click where it goes.','Klik benda itu, lalu klik tempat tujuannya.',1)}}


/* menu */
function home(){
 if(!me)return start();
 window.onkeydown=null;window.onkeyup=null;save();
 const TT=['Kind or Unkind?','Respectful or Disrespectful?','Find the Words','STOP – THINK – CHECK – SEND','Send, Change, or Ask for Help?','Make It Kind'];
 const M=[['🙂',m1],['⚖️',m2],['🔍',m3],['🚦',m4],['📨',m5],['✨',m6]];
 A.innerHTML=`<h1>${bi('Hello, '+esc(me.nama)+'!','Halo, '+esc(me.nama)+'!')}</h1><p class="sub">${bi('Choose a mission. Start from Mission 1 to 6.','Pilih satu misi. Kerjakan dari Misi 1 sampai 6.')}</p><div class="menu"></div><button class="mb wide" id="xt"><span>📝</span><b>Exit Ticket &amp; Reflection</b>${et?'<em>✅</em>':''}</button><p style="text-align:center;margin-top:18px"><button class="back" onclick="gantiSiswa()">Ganti siswa</button> <button class="back" onclick="teacher()">Untuk guru</button></p>`;
 const m=A.querySelector('.menu');
 M.forEach((x,i)=>{const b=$(`<button class="mb"><span>${x[0]}</span><b>Mission ${i+1}</b><small>${TT[i]}</small>${done[i]?'<em>✅</em>':''}</button>`);b.onclick=()=>{cur=i;ms[i]={s:0,x:0};recalc();x[1](i)};m.append(b)});
 A.querySelector('#xt').onclick=exitTicket;
 if(Object.keys(done).length>=6)m.before($(`<div class="card fp" style="margin-bottom:14px"><div class="big">🏆</div><h2>${bi('You are a Respectful Communicator! ⭐ '+stars+'/'+MAX,'Kamu Komunikator yang Santun!')}</h2></div>`));
}
function finish(i,text){done[i]=1;add(2);ok();save();window.onkeydown=null;window.onkeyup=null;
 const all=Object.keys(done).length>=6;
 A.innerHTML=`<div class="card"><div class="big">${all?'🏆':'🎉'}</div><h2>${all?bi('You are a Respectful Communicator, '+esc(me.nama)+'!','Kamu Komunikator yang Santun, '+esc(me.nama)+'!'):bi('Great job!','Hebat!')}</h2><p>${text}</p>${all?`<p><b>${bi('Final score: ⭐ '+stars+' / '+MAX,'Skor akhir')}</b></p>`:''}<button class="go" onclick="home()">${bi('Back to menu','Kembali ke menu')}</button></div>`}

function runRounds(i,rs,fin){let n=0;const go=()=>{if(n>=rs.length){window.onkeydown=null;window.onkeyup=null;return finish(i,fin)}rs[n++](go)};go()}
/* pertanyaan pilihan (dua kesempatan) */
function ask(o,next){
 let lock=0,wrong=0;const bm={};
 A.innerHTML=`${hdr(o.title)}<h2>${o.q}</h2>${o.pic||''}<div class="opts${o.row?' row':''}${o.three?' three':''}"></div><p id="msg" class="msg"></p>`;
 const ops=A.querySelector('.opts');
 (o.order||(o.fixed?o.opts.map((x,i)=>i):shuffle(o.opts.map((x,i)=>i)))).forEach(i=>{const x=o.opts[i];const b=$(`<button class="${o.cls||''}">${x[1]}</button>`);bm[x[0]]=b;
  b.onclick=()=>{if(lock||b.disabled)return;if(o.first&&!o._f){o._f=1;o.first(x[0])}
   if(x[0]===o.ok){lock=1;ok();add();b.classList.add('ok');msg('Correct! '+o.why[0],'Benar! '+o.why[1],1);setTimeout(next,2500);return}
   no();wrong++;lock=1;b.classList.add('dim');b.disabled=true;ops.classList.add('lk');shake(b);
   if(wrong>=2){bm[o.ok].classList.add('ok');msg('The answer is highlighted. '+o.why[0],'Jawabannya ditandai. '+o.why[1],1);setTimeout(next,3300)}
   else{msg(o.hint[0],o.hint[1]);setTimeout(()=>{lock=0;ops.classList.remove('lk')},1600)}};
  ops.append(b)})}


/* posisi jawaban benar diseimbangkan (tidak condong ke satu sisi) */
const balPos=(n,len)=>{const a=[];for(let k=0;k<n;k++)a.push(k%len);return shuffle(a)};
const ordered=R=>{const g={};R.forEach((r,k)=>{(g[r.opts.length]=g[r.opts.length]||[]).push(k)});const pos={};
 Object.keys(g).forEach(L=>{const ps=balPos(g[L].length,+L);g[L].forEach((k,j)=>{pos[k]=ps[j]})});
 return R.map((r,k)=>{const c=r.opts.findIndex(x=>x[0]===r.ok);const rest=shuffle(r.opts.map((x,i)=>i).filter(i=>i!==c));rest.splice(pos[k],0,c);return {...r,order:rest}})};

/* ===== Misi 1: Kind or Unkind? ===== */
function m1(i){
 const T='Mission 1 · Kind or Unkind?';
 const big=(t,id)=>`<div class="msgbox" style="font-size:22px;text-align:center">${bi(esc(t),esc(id))}</div>`;

function m4(i){

   if(++placed>=ST.length)setTimeout(nx,1300)};
  dnd(items,targets,(it,t)=>{
   const k=it.dataset.k;

 const typed=(idx,title,starter,chips,get,set,next,min)=>{
  A.innerHTML=`${hdr(N+' ('+idx+'/4)')}${intro}<h2>${title}</h2><div class="sent">${starter}</div><input class="ti" id="ti" maxlength="120" autocomplete="off" value="${esc(get())}"><p class="intro">${bi('Write it in your own words. Ideas you can write about: '+chips.map(c=>c[0]).join('; ')+'.','Tulis dengan kata-katamu sendiri. Ide yang bisa kamu tulis: '+chips.map(c=>c[1]).join('; ')+'.')}</p><p id="msg" class="msg"></p><button class="go" id="dn" disabled>${bi('Next','Lanjut')}</button>`;
  const ti=A.querySelector('#ti'),dn=A.querySelector('#dn');
  const upd=()=>{dn.disabled=words(ti.value)<min};
  ti.oninput=upd;ti.onkeydown=e=>{if(e.key==='Enter'&&!dn.disabled)dn.onclick()};
  dn.onclick=()=>{set(ti.value.trim());ok();next()};upd();ti.focus()};
 const s3=()=>typed(3,bi('Finish the sentence.','Lengkapi kalimatnya.'),bi('Before I send a digital message, I should…','Sebelum aku mengirim pesan digital, aku sebaiknya…'),[['stop and think','berhenti dan berpikir'],['check my words','memeriksa kata-kataku'],['ask an adult if I am unsure','bertanya pada orang dewasa jika ragu']],()=>tb,v=>{tb=v},s4,3);
 const s4=()=>typed(4,bi('Finish the sentence.','Lengkapi kalimatnya.'),bi('Respectful communication is important because…','Komunikasi yang santun itu penting karena…'),[['it makes people feel good','membuat orang merasa nyaman'],['it shows respect','menunjukkan rasa hormat'],['words can hurt feelings','kata-kata bisa melukai perasaan']],()=>tw,v=>{tw=v},fin,4);
 const fin=()=>{
  et={m:mi,r:rs.slice(),b:tb,w:tw,x:tries,done:1};save();
  A.innerHTML=`<div class="card"><div class="big">📝</div><h2>${bi('My Exit Ticket','Tiket Keluarku')}</h2><div class="sent">${bi(`Respectful digital communication means <b>${MEANS[mi][0]}</b>.`,`Komunikasi digital yang santun artinya <b>${MEANS[mi][1]}</b>.`)}</div><div class="sent">${bi('My three important rules: <b>'+rs.map(k=>RULES[k][0]).join(' ')+'</b>','Tiga aturan pentingku: <b>'+rs.map(k=>RULES[k][1]).join(' ')+'</b>')}</div><div class="sent">${bi('Before I send a digital message, I should <b>'+esc(tb)+'</b>.','Sebelum aku mengirim pesan digital, aku sebaiknya <b>'+esc(tb)+'</b>.')}</div><div class="sent">${bi('Respectful communication is important because <b>'+esc(tw)+'</b>.','Komunikasi yang santun itu penting karena <b>'+esc(tw)+'</b>.')}</div><p>${bi('Ready to share? Read your sentences to the class!','Siap berbagi? Bacakan kalimatmu di depan kelas!')}</p><button class="go" onclick="home()">${bi('Back to menu','Kembali ke menu')}</button></div>`};
 s1()}
start();
