const rowOf=r=>{const f=r.f||{},c=r.s||{},k=r.k||{},g=r.g||{},e=r.e||{},m=r.m||[];const x=i=>m[i]&&(m[i].d||m[i].x)?m[i].x:'';
 return [r.nama,r.kelas,x(1),x(2),f.who||'',f.copied?'Ya':'',(f.t||[]).filter(Boolean).length||'',c.about||'',c.want||'',c.why||'',k.partner||'',k.like||'',k.maybe||'',k.noticed||'',(k.checks||[]).filter(Boolean).length||'',k.said||'',g.opened?'Ya':'',g.liked||'',e.made||'',e.a||'',e.b||'',e.c||'',e.d||'',e.self?e.self.length:'',r.misi||0,r.o||0,r.waktu]};

const QK='pm7_queue';let qmem={},sending=0;

async function flush(){
 if(!SYNC||sending)return;sending=1;
 try{
  const q=qload();
  for(const id of Object.keys(q)){
   await fetch(SYNC,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({tab:TAB,head:['ID'].concat(HD),row:q[id]})});
   const q2=qload();if(JSON.stringify(q2[id])===JSON.stringify(q[id]))delete q2[id];qsave(q2);
  }
 }catch(e){}
 sending=0}

setInterval(flush,30000);window.addEventListener('online',flush);

 done={};ms={};me=null;et=null;fp=null;sh=null;fbk=null;gal=null;dropOut=0;fb=0;window.onkeydown=null;window.onkeyup=null;recalc();setLang(false);

}

 if(skip!==true)return gate();
 const all=load(),a=all.filter(r=>!flt||r.kelas===flt);

 const rows=a.map(r=>`<tr><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td>${[0,1,2,3,4,5].map(i=>`<td>${cell(r,i)}</td>`).join('')}<td>${(r.f||{}).copied?'Ya':'–'}</td></tr>`).join('')||'<tr><td colspan="9">Belum ada hasil.</td></tr>';

 const erow=a.map(r=>{const e=r.e||{};return `<tr><td>${esc(r.nama)}</td><td>${esc(r.kelas)}</td><td>${esc(e.a||'–')}</td><td>${esc(e.b||'–')}</td><td>${esc(e.c||'–')}</td><td>${esc(e.d||'–')}</td><td>${e.self?e.self.length+'/8':'–'}</td></tr>`}).join('')||'<tr><td colspan="7">Belum ada hasil.</td></tr>';
 const sel=`<select id="fl"><option value="">Semua kelas</option>${KLS.map(k=>`<option${k===flt?' selected':''}>${k}</option>`).join('')}</select>`;
 const syTxt=SYNC?'Google Sheet: aktif. Menunggu terkirim: '+Object.keys(qload()).length+'.':'Google Sheet: belum diatur. Hasil hanya tersimpan di komputer ini.';
 A.innerHTML=`${hdr('Hasil Pertemuan 7')}<p>Kelas: ${sel}</p><div class="tw"><table><tr><th>Nama</th><th>Kelas</th>${MN.map(n=>`<th>${n}</th>`).join('')}<th>Link disalin</th></tr>${rows}</table></div><p class="intro">✅ = misi selesai. "salah" = jumlah pilihan yang belum tepat (Misi 2 dan 3).</p><h2>Berbagi, umpan balik, dan galeri</h2><div class="tw"><table><tr><th>Nama</th><th>Kelas</th><th>My poster is about</th><th>I want people to</th><th>Partner</th><th>I like… because…</th><th>Maybe you could…</th><th>Partner said</th><th>Poster yang disukai</th></tr>${prow}</table></div><h2>Exit Ticket dan Refleksi</h2><div class="tw"><table><tr><th>Nama</th><th>Kelas</th><th>I communicated respectfully by…</th><th>I showed responsibility by…</th><th>I learned…</th><th>I will…</th><th>Penilaian diri</th></tr>${erow}</table></div><p class="intro">${syTxt}</p><p id="msg" class="msg"></p><button class="go" id="dl">Unduh CSV</button> <button class="go" id="sy"${SYNC?'':' disabled'}>Kirim ulang ke Google Sheet</button> <button class="go" id="cl">Hapus semua</button><div id="ta"></div>`;

  showTxt('Kalau file belum terunduh, salin teks ini lalu tempel ke Google Sheets. Kolom akan terbagi otomatis:')};

/* utilitas drag & drop */
const at=(e,ts)=>ts.find(t=>{const r=t.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom});
function dnd(items,targets,drop){
 let sel=null;
 const pick=x=>{sel=x;items.forEach(i=>i.classList.toggle('sel',i===x))};
 items.forEach(it=>{
  let on=0,sx=0,sy=0;
  it.classList.add('dg');it.style.touchAction='none';
  it.onpointerdown=e=>{if(e.button!==0||it.dataset.lock)return;e.preventDefault();on=1;sx=e.clientX;sy=e.clientY;it.dataset.mv='';it.setPointerCapture(e.pointerId);it.classList.add('drg');it.style.transition='none'};
  it.onpointermove=e=>{if(!on)return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)+Math.abs(dy)>6)it.dataset.mv='1';it.style.transform=`translate(${dx}px,${dy}px)`;const t=at(e,targets);targets.forEach(x=>x.classList.toggle('over',x===t))};
  const end=e=>{if(!on)return;on=0;it.classList.remove('drg');const t=at(e,targets);targets.forEach(x=>x.classList.remove('over'));it.style.transition='transform .25s';it.style.transform='';if(it.dataset.mv)drop(it,t||null)};
  it.onpointerup=end;it.onpointercancel=end;
  it.onclick=()=>{if(fb&&!it.dataset.lock&&!it.dataset.mv)pick(it)};
 });
 targets.forEach(t=>t.onclick=()=>{if(fb&&sel){const i=sel;pick(null);drop(i,t)}});
}

 const TT=['Finish My Poster','Kind or Unkind Feedback','Feedback Starters','Share My Poster','Give Feedback','Gallery Walk'];
 const M=[['🖼️',m1],['💬',m2],['✍️',m3],['🗣️',m4],['🤝',m5],['🌟',m6]];
 A.innerHTML=`<h1>${bi('Hello, '+esc(me.nama)+'!','Halo, '+esc(me.nama)+'!')}</h1><p class="sub">${bi('Choose a mission. Start from Mission 1 to 6.','Pilih satu misi. Kerjakan dari Misi 1 sampai 6.')}</p><div class="menu"></div><button class="mb wide" id="xt"><span>📝</span><b>Exit Ticket &amp; Reflection</b>${et?'<em>✅</em>':''}</button><p style="text-align:center;margin-top:18px"><button class="back" onclick="gantiSiswa()">Ganti siswa</button> <button class="back" onclick="teacher()">Untuk guru</button></p>`;
 const m=A.querySelector('.menu');
 M.forEach((x,i)=>{const b=$(`<button class="mb"><span>${x[0]}</span><b>Mission ${i+1}</b><small>${TT[i]}</small>${done[i]?'<em>✅</em>':''}</button>`);b.onclick=()=>{cur=i;ms[i]={s:0,x:0};recalc();x[1](i)};m.append(b)});

function finish(i,text){done[i]=1;ok();save();window.onkeydown=null;window.onkeyup=null;
 const all=Object.keys(done).length>=6;
 A.innerHTML=`<div class="card"><div class="big">${all?'🏆':'🎉'}</div><h2>${all?bi('You are a kind and responsible communicator, '+esc(me.nama)+'!','Kamu komunikator yang baik dan bertanggung jawab, '+esc(me.nama)+'!'):bi('Great job!','Hebat!')}</h2><p>${text}</p><button class="go" onclick="home()">${bi('Back to menu','Kembali ke menu')}</button></div>`}
function runRounds(i,rs,fin){let n=0;const go=()=>{if(n>=rs.length){window.onkeydown=null;window.onkeyup=null;return finish(i,fin)}rs[n++](go)};go()}
/* pertanyaan pilihan (dua kesempatan) */
function ask(o,next){
 let lock=0,wrong=0;const bm={};
 A.innerHTML=`${hdr(o.title)}<h2>${o.q}</h2>${o.pic||''}<div class="opts${o.row?' row':''}${o.three?' three':''}"></div><p id="msg" class="msg"></p>`;
 const ops=A.querySelector('.opts');
 (o.order||(o.fixed?o.opts.map((x,i)=>i):shuffle(o.opts.map((x,i)=>i)))).forEach(i=>{const x=o.opts[i];const b=$(`<button class="${o.cls||''}">${x[1]}</button>`);bm[x[0]]=b;
  b.onclick=()=>{if(lock||b.disabled)return;if(o.first&&!o._f){o._f=1;o.first(x[0])}
   if(x[0]===o.ok){lock=1;ok();add();b.classList.add('ok');msg('Correct! '+o.why[0],'Benar! '+o.why[1],1);setTimeout(next,2500);return}
   no();wrong++;lock=1;b.classList.add('dim');b.disabled=true;ops.classList.add('lk');shake(b);
   if(wrong>=2){bm[o.ok].classList.add('ok');msg('The answer is highlighted. '+o.why[0],'Jawabannya ditandai. '+o.why[1],1);setTimeout(next,3300)}
   else{msg(o.hint[0],o.hint[1]);setTimeout(()=>{lock=0;ops.classList.remove('lk')},1600)}};
  ops.append(b)})}


/* posisi jawaban benar diseimbangkan (tidak condong ke satu sisi) */
const balPos=(n,len)=>{const a=[];for(let k=0;k<n;k++)a.push(k%len);return shuffle(a)};
const ordered=R=>{const g={};R.forEach((r,k)=>{(g[r.opts.length]=g[r.opts.length]||[]).push(k)});const pos={};
 Object.keys(g).forEach(L=>{const ps=balPos(g[L].length,+L);g[L].forEach((k,j)=>{pos[k]=ps[j]})});
 return R.map((r,k)=>{const c=r.opts.findIndex(x=>x[0]===r.ok);const rest=shuffle(r.opts.map((x,i)=>i).filter(i=>i!==c));rest.splice(pos[k],0,c);return {...r,order:rest}})};

const copyTxt=(t,btn)=>{const done=()=>{const o=btn.innerHTML;btn.textContent='✅ Copied';setTimeout(()=>{btn.innerHTML=o},1500)};
 const fb2=()=>{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();try{document.execCommand('copy')}catch(e){}ta.remove();done()};
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,fb2);else fb2()};
const wc=t=>t.trim().split(/\s+/).filter(Boolean).length;
const copyRow=t=>{const r=$(`<div class="crow"><span>${esc(t)}</span><button class="cbtn">${bi('Copy','Salin')}</button></div>`);r.querySelector('button').onclick=e=>copyTxt(t,e.currentTarget);return r};
/* isian ketik: o.start = awalan, o.check(v) -> null jika benar atau [en,id] pesan */
function typedStep(o){
 A.innerHTML=`${o.nav}<h2>${o.heading}</h2><div class="sent">${o.prompt}</div><input class="ti" id="ti" maxlength="${o.max||140}" autocomplete="off" value="${esc(o.get()||o.start||'')}"><p class="intro">${o.hint||''}</p><p id="msg" class="msg"></p><button class="go" id="dn" disabled>${bi(o.last?'Done':'Next',o.last?'Selesai':'Lanjut')}</button>${o.skip?`<button class="back" id="sk">${bi('Skip','Lewati')}</button>`:''}`;
 const ti=A.querySelector('#ti'),dn=A.querySelector('#dn'),mg=A.querySelector('#msg');
 const upd=()=>{const v=ti.value;const err=o.check?o.check(v):null;dn.disabled=wc(v)<o.min||!!err;mg.className='msg';mg.innerHTML=(err&&wc(v)>=2)?bi(err[0],err[1]):''};
 ti.oninput=upd;ti.onkeydown=e=>{if(e.key==='Enter'&&!dn.disabled)dn.onclick()};
 dn.onclick=()=>{o.set(ti.value.trim());ok();o.next()};
 if(o.skip)A.querySelector('#sk').onclick=()=>{o.set('');o.next()};
 upd();ti.focus();const L=ti.value.length;try{ti.setSelectionRange(L,L)}catch(e){}}
const startsWith=(v,p)=>v.trim().toLowerCase().startsWith(p);
const sample=()=>`<div class="po" style="aspect-ratio:auto;padding:12px 16px;gap:6px"><div style="font-size:26px;font-weight:800">Be Kind Online!</div><div style="font-size:18px">Kind words make friends.</div><div style="font-size:38px">💖 🌍</div><div style="font-size:15px;text-align:left;align-self:center"><div>✔ Use kind words.</div><div>✔ Respect others.</div><div>✔ Think before you send.</div></div></div>`;
const tickRow=(label,get,set,onChange)=>{const b=$(`<button>${get()?'☑':'☐'} ${bi(label[0],label[1])}</button>`);b.onclick=()=>{set(!get());b.classList.toggle('ok',!!get());b.firstChild.textContent=get()?'☑ ':'☐ ';onChange&&onChange()};b.classList.toggle('ok',!!get());return b};

const chromeSVG=(()=>{const R=46,p=a=>[50+R*Math.cos(a*Math.PI/180),50-R*Math.sin(a*Math.PI/180)];const w=(a0,a1,c)=>{const[x0,y0]=p(a0),[x1,y1]=p(a1);return `<path d="M50 50L${x0.toFixed(1)} ${y0.toFixed(1)}A${R} ${R} 0 0 0 ${x1.toFixed(1)} ${y1.toFixed(1)}Z" fill="${c}"/>`};return `<svg viewBox="0 0 100 100">${w(30,150,'#ea4335')}${w(150,270,'#34a853')}${w(270,390,'#fbbc05')}<circle cx="50" cy="50" r="22" fill="#fff"/><circle cx="50" cy="50" r="17" fill="#4285f4"/></svg>`})();
const chromeIc=()=>`<span class="ci">${chromeSVG}<img src="${IMG_PLATE}" alt=""></span>`;
function m1(i){
 const T='Mission 1 · Finish My Poster';
 fp={t:[0,0,0,0,0],copied:0,who:''};
 let posters=[],sel=null,st='loading',onSt=null,copiedUrl='';
 /* daftar kelas dimuat diam-diam sejak halaman 1 */
 const load=async()=>{
  st='loading';onSt&&onSt();
  try{
   const r=await Promise.race([fetch(API+'?mode=links'),new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),25000))]);
   const d=await r.json();posters=d.posters||[];st='ok'}
  catch(e){st='err'}
  onSt&&onSt()};
 load();
 const norm=t=>String(t||'').toLowerCase().replace(/[^a-z]/g,'');
 const numOf=p=>parseInt(String(p.nama||'').trim(),10)||0;

 /* Halaman 1: periksa poster */
 const p1=()=>{
  onSt=null;
  A.innerHTML=`${hdr(T+' (1/2)')}<h2>${bi('Finish your poster.','Selesaikan posterku.')}</h2>
  <div class="stp"><p>${bi('Does your poster have all five?','Apakah posterku punya kelima hal ini?')}</p><div class="opts" id="rc"></div></div>
  <button class="go" id="nx" disabled>${bi('Next','Lanjut')}</button>`;
  const nx=A.querySelector('#nx');
  const upd=()=>{nx.disabled=!fp.t.every(Boolean)};
  const rc=A.querySelector('#rc');
  RECIPE.forEach((r,k)=>rc.append(tickRow(r,()=>fp.t[k],v=>{fp.t[k]=v?1:0},upd)));
  upd();nx.onclick=p2};

 /* Halaman 2: salin link Canva */
 const p2=()=>{
  A.innerHTML=`${hdr(T+' (2/2)')}<h2>${bi('Copy your Canva link.','Salin link Canva-ku.')}</h2>
  <div class="stp"><p id="ld" class="fing">${bi('Loading your class list…','Memuat daftar kelasmu…')}</p>
  <div id="lk" style="display:none"><p><b>${bi('Choose your name:','Pilih namamu:')}</b></p><select class="ti" id="who"></select>
  <ol><li>${bi('Press the Copy button.','Tekan tombol Salin.')}</li><li>${bi('Open the Chrome called Informatics Class.','Buka Chrome yang bernama Informatics Class.')}</li><li>${bi('Paste (Ctrl+V) in the address bar. Press Enter. Continue your poster.','Tempel (Ctrl+V) di kolom alamat. Tekan Enter. Lanjutkan posterku.')}</li></ol>
  <div style="text-align:center">${chromeIc()}<p><b>Informatics Class</b></p></div>
  <div class="mb2" aria-hidden="true"><span class="nv">←</span><span class="nv">→</span><span class="nv">⟳</span><div class="ab hl"><span class="gl">G</span>Ask Google or type a URL</div><img class="av2" src="${IMG_PLATE}" alt=""></div>
  <p class="arw2">⬆ ${bi('Paste here (Ctrl+V)','Tempel di sini (Ctrl+V)')}</p>
  <p style="text-align:center"><button class="go bigcopy" id="cp" disabled>📋 ${bi('Copy my Canva link','Salin link Canva-ku')}</button></p><p id="cm" class="msg"></p>
  <div class="msgbox"><p><b>${bi('Try it first','Coba dulu')}</b></p><p>${bi('Click the box. Press Ctrl+V.','Klik kotak ini. Tekan Ctrl+V.')}</p><input class="ti" id="pt" autocomplete="off" spellcheck="false" placeholder="Ask Google or type a URL"><p id="pm" class="msg"></p></div></div>
  <div id="er" style="display:none"><p class="fing">${bi('Could not load the list. Ask your teacher.','Daftar belum bisa dimuat. Tanya gurumu.')}</p><button class="back" id="rt">${bi('Try again','Coba lagi')}</button></div></div>
  <p id="msg" class="msg"></p><button class="go" id="dn" disabled>${bi('Done','Selesai')}</button>`;
  const $q=id=>A.querySelector('#'+id);
  const updDone=()=>{$q('dn').disabled=!(fp.copied||st==='err')};
  const draw=()=>{
   const mine=posters.filter(p=>String(p.kelas).trim()===String(me.kelas).trim()).sort((a,b)=>numOf(a)-numOf(b));
   const sl=$q('who');
   sl.innerHTML='<option value="">–</option>'+mine.map((p,k)=>`<option value="${k}">${esc(p.nama)}</option>`).join('');
   const t=norm(me.nama);const hit=mine.map((p,k)=>[k,norm(p.nama)]).filter(x=>x[1]&&t&&(x[1]===t||(x[1].length>=3&&t.includes(x[1]))||(t.length>=3&&x[1].includes(t))));
   if(hit.length===1)sl.value=String(hit[0][0]);
   const upd=()=>{sel=sl.value===''?null:mine[+sl.value];const ok2=!!(sel&&sel.canva_url);$q('cp').disabled=!ok2;$q('cm').innerHTML=(sel&&!sel.canva_url)?bi('No link yet. Ask your teacher.','Belum ada tautan. Tanya gurumu.'):''};
   sl.onchange=upd;upd()};
  const show=()=>{
   $q('ld').style.display=st==='loading'?'block':'none';
   $q('er').style.display=st==='err'?'block':'none';
   $q('lk').style.display=st==='ok'?'block':'none';
   if(st==='ok')draw();
   updDone()};
  onSt=show;show();
  $q('rt').onclick=load;
  $q('cp').onclick=e=>{if(!sel||!sel.canva_url)return;copiedUrl=String(sel.canva_url).trim();copyTxt(copiedUrl,e.currentTarget);fp.copied=1;$q('pt').value='';$q('pm').innerHTML='';fp.who=sel.nama;$q('cm').innerHTML=bi('Link copied! ✅ Now open Informatics Class and paste it.','Link tersalin! ✅ Sekarang buka Informatics Class dan tempel.');updDone()};
  $q('pt').oninput=()=>{const v=$q('pt').value.trim(),m=$q('pm');if(!v){m.innerHTML='';return}
   if(!copiedUrl){m.className='msg bad';m.innerHTML=bi('Press the Copy button first.','Tekan tombol Salin dulu.');return}
   if(v===copiedUrl){m.className='msg good';m.innerHTML=bi('You pasted it! ✅ Now do the same in Informatics Class.','Berhasil menempel! ✅ Sekarang lakukan hal yang sama di Informatics Class.');ok()}
   else{m.className='msg bad';m.innerHTML=bi('Not the link yet. Click Copy, click this box, then press Ctrl+V.','Belum link-nya. Tekan Salin, klik kotak ini, lalu tekan Ctrl+V.')}};
  $q('dn').onclick=()=>finish(i,bi('Keep working on your poster in Canva!','Lanjutkan posterku di Canva!'))};
 p1()}

/* ===== Misi 2: Kind or Unkind Feedback ===== */
function m2(i){
 const T='Mission 2 · Kind or Unkind Feedback';
 const KU=[['k',bi('✅ Kind and useful','✅ Baik dan berguna')],['u',bi('❌ Unkind or not helpful','❌ Kurang baik atau tidak membantu')]];
 const quote=(en,id)=>`<div class="msgbox"><p class="fing">${bi('A friend says about a poster:','Seorang teman berkata tentang sebuah poster:')}</p><p class="qt">${bi('“'+esc(en)+'”','“'+esc(id)+'”')}</p></div>`;
 const C=[
  ['I like your colors because they are bright.','Aku suka warnamu karena cerah.','k',['It says what is good, with a reason.','Komentar ini menyebut hal yang bagus, lengkap dengan alasannya.']],
  ['Your poster is ugly.','Posterimu jelek.','u',['It is unkind. It does not help your friend improve.','Komentar ini kasar. Tidak membantu temanmu menjadi lebih baik.']],
  ['Maybe you could make the title bigger.','Mungkin kamu bisa membuat judulnya lebih besar.','k',['It is polite and gives an idea to improve.','Komentar ini sopan dan memberi ide untuk memperbaiki.']],
  ['This is boring.','Ini membosankan.','u',['It does not say what to change. It is not helpful.','Komentar ini tidak menyebut apa yang perlu diubah. Tidak membantu.']],
  ['I noticed your picture matches your message.','Aku melihat gambarmu cocok dengan pesanmu.','k',['It is about the work and it is kind.','Komentar ini tentang karyanya dan baik.']],
  ['My poster is better than yours.','Posterku lebih bagus daripada posterimu.','u',['It compares and can make someone feel bad.','Komentar ini membandingkan dan bisa membuat orang merasa buruk.']]];
 const R=C.map(c=>({pic:quote(c[0],c[1]),q:bi('Is this feedback kind and useful?','Apakah umpan balik ini baik dan berguna?'),opts:KU,ok:c[2],row:1,why:c[3],hint:['Think: is it kind? Is it about the work? Can it help?','Pikirkan: apakah baik? Apakah tentang karyanya? Apakah bisa membantu?']}));
 const summary=nx=>{A.innerHTML=`${hdr(T+' · What did we learn?')}<h2>${bi('Kind and useful feedback…','Umpan balik yang baik dan berguna…')}</h2><div class="msgbox"><p>${FBC.map(f=>'✅ '+bi(f[0].replace('My feedback','Feedback'),f[1].replace('Umpan balikku','Umpan balik')).replace(/^/,'')).join('</p><p>')}</p></div><p class="intro">${bi('Feedback should help someone improve, not make them feel bad.','Umpan balik harus membantu seseorang menjadi lebih baik, bukan membuatnya merasa buruk.')}</p><button class="go" id="nx">${bi('Next','Lanjut')}</button>`;A.querySelector('#nx').onclick=nx};
 runRounds(i,[...ordered(R).map((r,k)=>nx=>ask({...r,title:T+' ('+(k+1)+'/'+R.length+')'},nx)),summary],bi('You can tell kind and useful feedback!','Kamu bisa mengenali umpan balik yang baik dan berguna!'))}

/* ===== Misi 3: Feedback Starters ===== */
function m3(i){
 const T='Mission 3 · Feedback Starters';
 const mk=(q,opts,why,hint)=>({pic:sample(),q,opts:opts.map((o,k)=>[k?'x'+k:'a',bi(o[0],o[1])]),ok:'a',why,hint});
 const R=[
  mk(bi('Which sentence uses “I like… because…” well?','Kalimat mana yang memakai “I like… because…” dengan baik?'),[['I like the big title because it is easy to read.','I like the big title because it is easy to read.'],['I like.','I like.'],['I like your poster. It is ugly.','I like your poster. It is ugly.']],['It says what you like and gives a reason.','Kalimat ini menyebut yang kamu suka dan memberi alasan.'],['Look for the word “because”.','Cari kata “because”.']),
  mk(bi('Which sentence uses “I noticed…” well?','Kalimat mana yang memakai “I noticed…” dengan baik?'),[['I noticed that your pictures match your message.','I noticed that your pictures match your message.'],['I noticed you are slow.','I noticed you are slow.'],['Noticed it.','Noticed it.']],['It says what you see in the poster.','Kalimat ini menyebut apa yang kamu lihat di poster.'],['“I noticed” is about the poster, not about the person.','“I noticed” tentang posternya, bukan tentang orangnya.']),
  mk(bi('Which sentence uses “Maybe you could…” well?','Kalimat mana yang memakai “Maybe you could…” dengan baik?'),[['Maybe you could make the reminders bigger.','Maybe you could make the reminders bigger.'],['You must change everything.','You must change everything.'],['Maybe you could stop.','Maybe you could stop.']],['It is polite and gives one idea.','Kalimat ini sopan dan memberi satu ide.'],['A good idea is polite and small.','Ide yang baik itu sopan dan kecil.'])];
 const practice=nx=>typedStep({nav:hdr(T+' · Your turn'),heading:bi('Now write your own sentence about this poster.','Sekarang tulis kalimatmu sendiri tentang poster ini.'),prompt:sample()+'<p>'+bi('Finish the sentence. Use the word “because”.','Lengkapi kalimatnya. Pakai kata “because”.')+'</p>',start:'I like ',hint:bi('Example: I like the heart because it matches the message.','Contoh: I like the heart because it matches the message.'),get:()=>'',set:()=>{},min:6,check:v=>(startsWith(v,'i like')&&/\bbecause\b/i.test(v))?null:['Start with “I like” and use the word “because”.','Mulai dengan “I like” dan pakai kata “because”.'],next:nx});
 runRounds(i,[...ordered(R).map((r,k)=>nx=>ask({...r,title:T+' ('+(k+1)+'/'+R.length+')'},nx)),practice],bi('You can use feedback starters!','Kamu bisa memakai kalimat pembuka umpan balik!'))}

/* ===== Misi 4: Share My Poster ===== */
function m4(i){
 const T='Mission 4 · Share My Poster';
 sh={about:'',want:'',why:'',shared:0,listened:0};
 const nav=n=>hdr(T+' ('+n+'/4)');
 const s1=()=>typedStep({nav:nav(1),heading:bi('What is your poster about?','Posterku tentang apa?'),prompt:bi('My poster is about…','Posterku tentang…'),start:'',hint:bi('Say the topic in a few words.','Sebutkan topiknya dalam beberapa kata.'),get:()=>sh.about,set:v=>{sh.about=v},min:2,next:s2});
 const s2=()=>typedStep({nav:nav(2),heading:bi('What do you want people to do?','Apa yang kamu ingin orang lain lakukan?'),prompt:bi('I want people to…','Aku ingin orang-orang…'),hint:bi('Example: be kind online.','Contoh: bersikap baik di dunia digital.'),get:()=>sh.want,set:v=>{sh.want=v},min:2,next:s3});
 const s3=()=>typedStep({nav:nav(3),heading:bi('Why did you choose this message?','Mengapa kamu memilih pesan ini?'),prompt:bi('I chose this message because…','Aku memilih pesan ini karena…'),hint:bi('Write it in your own words.','Tulis dengan kata-katamu sendiri.'),get:()=>sh.why,set:v=>{sh.why=v},min:3,next:s4});
 const s4=()=>{
  A.innerHTML=`${nav(4)}<h2>${bi('Share with your partner.','Bagikan kepada pasanganmu.')}</h2><div class="msgbox"><p>${bi('My poster is about <b>'+esc(sh.about)+'</b>.','Posterku tentang <b>'+esc(sh.about)+'</b>.')}</p><p>${bi('I want people to <b>'+esc(sh.want)+'</b>.','Aku ingin orang-orang <b>'+esc(sh.want)+'</b>.')}</p><p>${bi('I chose this message because <b>'+esc(sh.why)+'</b>.','Aku memilih pesan ini karena <b>'+esc(sh.why)+'</b>.')}</p></div><p class="intro">${bi('Read it to your partner. Then listen to your partner. Listen respectfully.','Bacakan kepada pasanganmu. Lalu dengarkan pasanganmu. Dengarkan dengan hormat.')}</p><div class="opts"></div><button class="go" id="dn" disabled>${bi('Done','Selesai')}</button>`;
  const o=A.querySelector('.opts'),dn=A.querySelector('#dn');const upd=()=>{dn.disabled=!(sh.shared&&sh.listened)};
  o.append(tickRow(['I shared my poster.','Aku membagikan posterku.'],()=>sh.shared,v=>{sh.shared=v?1:0},upd));
  o.append(tickRow(['I listened to my partner.','Aku mendengarkan pasanganku.'],()=>sh.listened,v=>{sh.listened=v?1:0},upd));
  dn.onclick=()=>finish(i,bi('You shared your poster and listened to others!','Kamu membagikan posternya dan mendengarkan orang lain!'))};
 s1()}

/* ===== Misi 5: Give Feedback ===== */
function m5(i){
 const T='Mission 5 · Give Feedback';
 fbk={partner:'',like:'',maybe:'',noticed:'',checks:[0,0,0],said:''};
 const nav=n=>hdr(T+' ('+n+'/7)');
 const s1=()=>typedStep({nav:nav(1),heading:bi('Who is your partner?','Siapa pasanganmu?'),prompt:bi('My partner is…','Pasanganku adalah…'),start:'',hint:bi('Write your partner’s name.','Tulis nama pasanganmu.'),get:()=>fbk.partner,set:v=>{fbk.partner=v},min:1,max:40,next:s2});
 const s2=()=>{A.innerHTML=`${nav(2)}<h2>${bi('Look at your partner’s poster.','Lihat poster pasanganmu.')}</h2><div class="msgbox"><p>${bi('Sit together and look at the same screen. Read the title, the message, the pictures, and the reminders.','Duduk bersama dan lihat layar yang sama. Baca judul, pesan, gambar, dan pengingatnya.')}</p></div><button class="go" id="nx">${bi('I looked at it','Aku sudah melihatnya')}</button>`;A.querySelector('#nx').onclick=s3};
 const s3=()=>typedStep({nav:nav(3),heading:bi('Say what you like.','Sebutkan yang kamu suka.'),prompt:bi('I like… because…','I like… because…'),start:'I like ',hint:bi('Example: I like your title because it is big and clear.','Contoh: I like your title because it is big and clear.'),get:()=>fbk.like,set:v=>{fbk.like=v},min:6,check:v=>(startsWith(v,'i like')&&/\bbecause\b/i.test(v))?null:['Start with “I like” and use the word “because”.','Mulai dengan “I like” dan pakai kata “because”.'],next:s4});
 const s4=()=>typedStep({nav:nav(4),heading:bi('Give one idea.','Beri satu ide.'),prompt:bi('Maybe you could…','Maybe you could…'),start:'Maybe you could ',hint:bi('Example: Maybe you could add one more picture.','Contoh: Maybe you could add one more picture.'),get:()=>fbk.maybe,set:v=>{fbk.maybe=v},min:5,check:v=>startsWith(v,'maybe you could')?null:['Start with “Maybe you could”.','Mulai dengan “Maybe you could”.'],next:s5});
 const s5=()=>typedStep({nav:nav(5),heading:bi('Optional: say what you noticed.','Opsional: sebutkan yang kamu lihat.'),prompt:bi('I noticed…','I noticed…'),start:'I noticed ',hint:bi('You can skip this one.','Kamu boleh melewati bagian ini.'),get:()=>fbk.noticed,set:v=>{fbk.noticed=(v&&v.trim().toLowerCase()!=='i noticed')?v:''},min:3,skip:true,check:v=>startsWith(v,'i noticed')?null:['Start with “I noticed”.','Mulai dengan “I noticed”.'],next:s6});
 const s6=()=>{A.innerHTML=`${nav(6)}<h2>${bi('Check your feedback.','Periksa umpan balikmu.')}</h2><div class="msgbox"><p>${bi(esc(fbk.like),esc(fbk.like))}</p><p>${bi(esc(fbk.maybe),esc(fbk.maybe))}</p>${fbk.noticed?'<p>'+esc(fbk.noticed)+'</p>':''}</div><div class="opts"></div><button class="go" id="dn" disabled>${bi('Next','Lanjut')}</button>`;
  const o=A.querySelector('.opts'),dn=A.querySelector('#dn');const upd=()=>{dn.disabled=!fbk.checks.every(Boolean)};
  FBC.forEach((f,k)=>o.append(tickRow(f,()=>fbk.checks[k],v=>{fbk.checks[k]=v?1:0},upd)));
  dn.onclick=s7};
 const s7=()=>{A.innerHTML=`${nav(7)}<h2>${bi('Tell your partner. Then listen.','Sampaikan kepada pasanganmu. Lalu dengarkan.')}</h2><div class="msgbox"><p>${bi('Say your feedback kindly. Then listen to the feedback from your partner.','Sampaikan umpan balikmu dengan baik. Lalu dengarkan umpan balik dari pasanganmu.')}</p></div><button class="go" id="nx">${bi('We did it','Kami sudah melakukannya')}</button>`;A.querySelector('#nx').onclick=s8};
 const s8=()=>typedStep({nav:hdr(T+' · What did you hear?'),heading:bi('What did your partner say?','Apa kata pasanganmu?'),prompt:bi('My partner said…','Pasanganku berkata…'),start:'My partner said ',hint:bi('Write one thing you heard.','Tulis satu hal yang kamu dengar.'),get:()=>fbk.said,set:v=>{fbk.said=v},min:5,last:true,next:()=>finish(i,bi('You gave kind feedback and listened!','Kamu memberi umpan balik yang baik dan mendengarkan!'))});
 s1()}

/* ===== Misi 6: Gallery Walk ===== */
function m6(i){

 gal={opened:0,looked:0,liked:''};
 A.innerHTML=`${hdr(T)}<h2>${bi('Visit the class gallery.','Kunjungi galeri kelas.')}</h2><div class="msgbox"><p>${bi('1. Open the Gallery Walk. 2. Choose your class and your name. 3. Look at at least three posters.','1. Buka Gallery Walk. 2. Pilih kelas dan namamu. 3. Lihat sedikitnya tiga poster.')}</p><p><a class="go" href="${GAL}" target="_blank" rel="noopener">${bi('Open the Gallery Walk','Buka Gallery Walk')}</a></p></div><div class="opts"></div><button class="go" id="dn" disabled>${bi('Next','Lanjut')}</button>`;

 dn.onclick=()=>typedStep({nav:hdr(T+' · Your favorite'),heading:bi('Choose one poster you like.','Pilih satu poster yang kamu suka.'),prompt:bi('I like ___’s poster because…','Aku suka poster ___ karena…'),start:'I like ',hint:bi('Write the name of your friend and a reason. Example: I like Kira’s poster because the title is clear.','Tulis nama temanmu dan alasannya. Contoh: I like Kira’s poster because the title is clear.'),get:()=>gal.liked,set:v=>{gal.liked=v},min:6,last:true,check:v=>(startsWith(v,'i like')&&/\bbecause\b/i.test(v))?null:['Start with “I like” and use the word “because”.','Mulai dengan “I like” dan pakai kata “because”.'],next:()=>finish(i,bi('You respected your friends’ work!','Kamu menghargai karya teman-temanmu!'))})}

/* ===== Exit Ticket & Reflection ===== */
function exitTicket(){
 const N='Exit Ticket &amp; Reflection';let made='',a='',b='',c='',d='',self=[];
 const nav=n=>hdr(N+' ('+n+'/6)');
 const idea=bi('Write it in your own words.','Tulis dengan kata-katamu sendiri.');
 const s1=()=>{A.innerHTML=`${nav(1)}<h2>${bi('What did I create?','Apa yang kubuat?')}</h2><div class="sent">${bi('I created a…','Aku membuat sebuah…')}</div><div class="opts"></div><p id="msg" class="msg"></p>`;
  const o=A.querySelector('.opts');
  [['digital poster','poster digital',1],['pizza','pizza',0],['song','lagu',0]].forEach(x=>{const bt=$(`<button>${bi(x[0],x[1])}</button>`);bt.onclick=()=>{if(x[2]){made=x[0];ok();bt.classList.add('ok');setTimeout(s2,900)}else{no();bt.classList.add('dim');bt.disabled=true;msg('Not quite. Think about what you made in Canva.','Belum tepat. Ingat apa yang kamu buat di Canva.')}};o.append(bt)})};
 const s2=()=>typedStep({nav:nav(2),heading:bi('Finish the sentence.','Lengkapi kalimatnya.'),prompt:bi('I communicated respectfully by…','Aku berkomunikasi dengan sopan dengan…'),hint:idea,get:()=>a,set:v=>{a=v},min:3,next:s3});
 const s3=()=>typedStep({nav:nav(3),heading:bi('Finish the sentence.','Lengkapi kalimatnya.'),prompt:bi('I showed responsibility by…','Aku menunjukkan tanggung jawab dengan…'),hint:idea,get:()=>b,set:v=>{b=v},min:3,next:s4});
 const s4=()=>typedStep({nav:nav(4),heading:bi('Finish the sentence.','Lengkapi kalimatnya.'),prompt:bi('I learned… from someone else’s feedback.','Aku belajar… dari umpan balik orang lain.'),hint:idea,get:()=>c,set:v=>{c=v},min:3,next:s5});
 const s5=()=>typedStep({nav:nav(5),heading:bi('Finish the sentence.','Lengkapi kalimatnya.'),prompt:bi('When I communicate online, I will…','Saat aku berkomunikasi online, aku akan…'),hint:idea,get:()=>d,set:v=>{d=v},min:3,next:s6});
 const s6=()=>{A.innerHTML=`${nav(6)}<h2>${bi('Check what you did.','Centang yang sudah kamu lakukan.')}</h2><div class="opts"></div><button class="go" id="dn">${bi('Done','Selesai')}</button>`;
  const o=A.querySelector('.opts');SELF8.forEach((x,k)=>o.append(tickRow(x,()=>self.includes(k),v=>{const j=self.indexOf(k);if(v&&j<0)self.push(k);if(!v&&j>=0)self.splice(j,1)})));
  A.querySelector('#dn').onclick=fin};
 const fin=()=>{
  et={made,a,b,c,d,self:self.slice(),done:1};save();
  A.innerHTML=`<div class="card"><div class="big">📝</div><h2>${bi('My Digital Communication Reflection','Refleksi Komunikasi Digitalku')}</h2><div class="sent">${bi('I created a <b>'+esc(made)+'</b>.','Aku membuat sebuah <b>'+esc(made)+'</b>.')}</div><div class="sent">${bi('I communicated respectfully by <b>'+esc(a)+'</b>.','Aku berkomunikasi dengan sopan dengan <b>'+esc(a)+'</b>.')}</div><div class="sent">${bi('I showed responsibility by <b>'+esc(b)+'</b>.','Aku menunjukkan tanggung jawab dengan <b>'+esc(b)+'</b>.')}</div><div class="sent">${bi('I learned <b>'+esc(c)+'</b> from someone else’s feedback.','Aku belajar <b>'+esc(c)+'</b> dari umpan balik orang lain.')}</div><div class="sent">${bi('When I communicate online, I will <b>'+esc(d)+'</b>.','Saat aku berkomunikasi online, aku akan <b>'+esc(d)+'</b>.')}</div><p>${bi('Ready to share? Read your sentences to the class!','Siap berbagi? Bacakan kalimatmu di depan kelas!')}</p><button class="go" onclick="home()">${bi('Back to menu','Kembali ke menu')}</button></div>`};
 s1()}
start();
